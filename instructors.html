<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAI GARMAI | Instructors</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 1000px;
    margin: auto;
}

.header {
    background: #0b3d62;
    color: white;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
}

.header h1 {
    margin: 0 0 5px;
}

.panel {
    background: white;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

input {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border: 1px solid #ddd;
    border-radius: 7px;
    font-size: 15px;
}

button {
    padding: 12px 18px;
    margin-top: 10px;
    border: none;
    border-radius: 7px;
    background: #0b3d62;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

.back {
    background: white;
    color: #0b3d62;
}

.delete {
    background: #d9534f;
}

.instructor {
    background: #f1f1f1;
    padding: 15px;
    margin-top: 12px;
    border-radius: 8px;
}

.credentials {
    background: #eaf5ea;
    padding: 12px;
    margin-top: 10px;
    border-radius: 8px;
    color: #155724;
}

.success {
    color: #198754;
    font-weight: bold;
    margin-top: 12px;
}

.error {
    color: #d9534f;
    font-weight: bold;
    margin-top: 12px;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
    <h1>NAI GARMAI SCHOOL SYSTEM</h1>
    <p>Instructor Management</p>

    <button class="back" onclick="goDashboard()">
        ← Dashboard
    </button>
</div>

<div class="panel" id="instructorForm">

    <h2>Add Instructor</h2>

    <input
        id="instructorName"
        type="text"
        placeholder="Instructor Full Name"
    >

    <input
        id="instructorId"
        type="text"
        placeholder="Instructor ID"
    >

    <input
        id="instructorSubject"
        type="text"
        placeholder="Subject / Department"
    >

    <input
        id="instructorPhone"
        type="text"
        placeholder="Phone Number"
    >

    <input
        id="instructorUsername"
        type="text"
        placeholder="Login Username"
    >

    <input
        id="instructorPassword"
        type="password"
        placeholder="Login Password"
    >

    <button onclick="addInstructor()">
        Add Instructor
    </button>

    <div id="message"></div>

</div>

<div class="panel">

    <h2>Instructor Records</h2>

    <div id="instructors"></div>

</div>

</div>

<script>

/* ================================
   SECURITY
================================ */

const loggedIn =
    localStorage.getItem("loggedIn");

const role =
    localStorage.getItem("userRole");

if (
    loggedIn !== "true" ||
    role !== "admin"
) {
    window.location.href = "login.html";
}


/* ================================
   LOAD INSTRUCTORS
================================ */

let instructors =
    JSON.parse(
        localStorage.getItem("instructors")
    ) || [];


/* ================================
   ADD INSTRUCTOR
================================ */

function addInstructor() {

    const name =
        document.getElementById(
            "instructorName"
        ).value.trim();

    const id =
        document.getElementById(
            "instructorId"
        ).value.trim();

    const subject =
        document.getElementById(
            "instructorSubject"
        ).value.trim();

    const phone =
        document.getElementById(
            "instructorPhone"
        ).value.trim();

    const username =
        document.getElementById(
            "instructorUsername"
        ).value.trim();

    const password =
        document.getElementById(
            "instructorPassword"
        ).value;

    const message =
        document.getElementById(
            "message"
        );


    if (
        name === "" ||
        id === "" ||
        subject === "" ||
        username === "" ||
        password === ""
    ) {

        message.className = "error";

        message.textContent =
            "Please complete all required fields.";

        return;
    }


    /* CHECK DUPLICATE ID */

    const duplicateId =
        instructors.find(
            function(instructor) {
                return String(instructor.id)
                    .toLowerCase()
                    ===
                    String(id)
                    .toLowerCase();
            }
        );


    if (duplicateId) {

        message.className = "error";

        message.textContent =
            "Instructor ID already exists.";

        return;
    }


    /* CHECK DUPLICATE USERNAME */

    const duplicateUsername =
        instructors.find(
            function(instructor) {
                return String(
                    instructor.username || ""
                )
                .toLowerCase()
                ===
                username.toLowerCase();
            }
        );


    if (duplicateUsername) {

        message.className = "error";

        message.textContent =
            "Username already exists.";

        return;
    }


    /* CREATE ACCOUNT */

    instructors.push({

        id: id,

        name: name,

        subject: subject,

        phone: phone,

        username: username,

        password: password

    });


    /* SAVE */

    localStorage.setItem(
        "instructors",
        JSON.stringify(instructors)
    );


    /* CLEAR */

    document.getElementById(
        "instructorName"
    ).value = "";

    document.getElementById(
        "instructorId"
    ).value = "";

    document.getElementById(
        "instructorSubject"
    ).value = "";

    document.getElementById(
        "instructorPhone"
    ).value = "";

    document.getElementById(
        "instructorUsername"
    ).value = "";

    document.getElementById(
        "instructorPassword"
    ).value = "";


    message.className = "success";

    message.textContent =
        "Instructor account created successfully.";


    displayInstructors();

}


/* ================================
   DISPLAY
================================ */

function displayInstructors() {

    const container =
        document.getElementById(
            "instructors"
        );

    container.innerHTML = "";


    if (
        instructors.length === 0
    ) {

        container.innerHTML =
            "<p>No instructors registered yet.</p>";

        return;
    }


    instructors.forEach(
        function(instructor, index) {

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "instructor";


            div.innerHTML =

                "<strong>Name:</strong> "
                +
                escapeHTML(
                    instructor.name
                )

                +
                "<br><strong>Instructor ID:</strong> "
                +
                escapeHTML(
                    instructor.id
                )

                +
                "<br><strong>Subject / Department:</strong> "
                +
                escapeHTML(
                    instructor.subject
                )

                +
                "<br><strong>Phone:</strong> "
                +
                escapeHTML(
                    instructor.phone ||
                    "Not provided"
                )

                +
                "<div class='credentials'>"
                +
                "<strong>Username:</strong> "
                +
                escapeHTML(
                    instructor.username
                )
                +
                "<br>"
                +
                "<strong>Password:</strong> "
                +
                escapeHTML(
                    instructor.password
                )
                +
                "</div>";


            const deleteButton =
                document.createElement(
                    "button"
                );

            deleteButton.className =
                "delete";

            deleteButton.textContent =
                "Delete";

            deleteButton.onclick =
                function() {
                    deleteInstructor(index);
                };


            div.appendChild(
                document.createElement("br")
            );

            div.appendChild(
                deleteButton
            );

            container.appendChild(div);

        }
    );

}


/* ================================
   DELETE
================================ */

function deleteInstructor(index) {

    if (!confirm(
        "Are you sure you want to delete this instructor?"
    )) {
        return;
    }

    instructors.splice(index, 1);

    localStorage.setItem(
        "instructors",
        JSON.stringify(instructors)
    );

    displayInstructors();
}


/* ================================
   DASHBOARD
================================ */

function goDashboard() {
    window.location.href =
        "index.html";
}


/* ================================
   SECURITY ESCAPE
================================ */

function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* ================================
   START
================================ */

displayInstructors();

</script>

</body>
</html>
