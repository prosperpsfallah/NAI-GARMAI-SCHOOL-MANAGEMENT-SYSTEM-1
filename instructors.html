<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NAI GARMAI | Instructors</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        .header {
            background: #0b3d62;
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 0 0 5px;
        }

        .panel {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            padding: 12px 18px;
            margin-top: 10px;
            border: none;
            border-radius: 7px;
            background: #0b3d62;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .back {
            background: white;
            color: #0b3d62;
        }

        .instructor {
            background: #f1f1f1;
            padding: 15px;
            margin-top: 12px;
            border-radius: 8px;
        }

        .delete {
            background: #d9534f;
        }

        #message {
            margin-top: 12px;
            font-weight: bold;
        }

    </style>

</head>


<body>


<div class="container">


    <div class="header">

        <h1>NAI GARMAI</h1>

        <p>Instructor Management</p>

        <button
            class="back"
            onclick="goDashboard()"
        >
            ← Dashboard
        </button>

    </div>


    <!-- ADD INSTRUCTOR -->

    <div
        class="panel"
        id="instructorForm"
    >

        <h2>Add Instructor</h2>

        <input
            id="instructorName"
            type="text"
            placeholder="Instructor Full Name"
        >

        <input
            id="instructorId"
            type="text"
            placeholder="Instructor ID"
        >

        <input
            id="instructorSubject"
            type="text"
            placeholder="Subject / Department"
        >

        <input
            id="instructorPhone"
            type="text"
            placeholder="Phone Number"
        >

        <button onclick="addInstructor()">
            Add Instructor
        </button>

        <div id="message"></div>

    </div>


    <!-- INSTRUCTOR RECORDS -->

    <div class="panel">

        <h2>Instructor Records</h2>

        <div id="instructors"></div>

    </div>


</div>


<script>


const role =
    localStorage.getItem(
        "userRole"
    );


let instructors =
    JSON.parse(
        localStorage.getItem(
            "instructors"
        )
    ) || [];


function setupRole() {

    const form =
        document.getElementById(
            "instructorForm"
        );


    if (role === "admin") {

        form.style.display =
            "block";

    } else {

        form.style.display =
            "none";

    }

}


function addInstructor() {

    if (role !== "admin") {

        alert(
            "Only the Administrator can add instructors."
        );

        return;

    }


    const name =
        document.getElementById(
            "instructorName"
        ).value.trim();


    const id =
        document.getElementById(
            "instructorId"
        ).value.trim();


    const subject =
        document.getElementById(
            "instructorSubject"
        ).value.trim();


    const phone =
        document.getElementById(
            "instructorPhone"
        ).value.trim();


    const message =
        document.getElementById(
            "message"
        );


    if (
        name === "" ||
        id === "" ||
        subject === ""
    ) {

        message.style.color =
            "red";

        message.textContent =
            "Please complete all required fields.";

        return;

    }


    const existing =
        instructors.find(
            function(instructor) {

                return instructor.id === id;

            }
        );


    if (existing) {

        message.style.color =
            "red";

        message.textContent =
            "Instructor ID already exists.";

        return;

    }


    instructors.push({

        name: name,

        id: id,

        subject: subject,

        phone: phone

    });


    localStorage.setItem(

        "instructors",

        JSON.stringify(
            instructors
        )

    );


    document.getElementById(
        "instructorName"
    ).value = "";


    document.getElementById(
        "instructorId"
    ).value = "";


    document.getElementById(
        "instructorSubject"
    ).value = "";


    document.getElementById(
        "instructorPhone"
    ).value = "";


    message.style.color =
        "green";


    message.textContent =
        "Instructor added successfully.";


    displayInstructors();

}


function displayInstructors() {

    const container =
        document.getElementById(
            "instructors"
        );


    container.innerHTML = "";


    if (
        instructors.length === 0
    ) {

        container.innerHTML =
            "<p>No instructors registered yet.</p>";

        return;

    }


    instructors.forEach(
        function(instructor, index) {


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "instructor";


            div.innerHTML =

                "<strong>Name:</strong> "
                + instructor.name

                + "<br><strong>Instructor ID:</strong> "
                + instructor.id

                + "<br><strong>Subject / Department:</strong> "
                + instructor.subject

                + "<br><strong>Phone:</strong> "
                + (
                    instructor.phone ||
                    "Not provided"
                );


            if (role === "admin") {

                div.innerHTML +=

                    "<br>"

                    + "<button "
                    + "class='delete' "
                    + "onclick='deleteInstructor("
                    + index
                    + ")'>"
                    + "Delete"
                    + "</button>";

            }


            container.appendChild(
                div
            );

        }
    );

}


function deleteInstructor(index) {

    if (role !== "admin") {

        return;

    }


    const confirmed =
        confirm(
            "Are you sure you want to delete this instructor?"
        );


    if (!confirmed) {

        return;

    }


    instructors.splice(
        index,
        1
    );


    localStorage.setItem(

        "instructors",

        JSON.stringify(
            instructors
        )

    );


    displayInstructors();

}


function goDashboard() {

    window.location.href =
        "index.html";

}


setupRole();

displayInstructors();


</script>


</body>

</html>
