<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NAI GARMAI | Instructor Management</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        .header {
            background: #0b3d62;
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .panel {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            padding: 12px 18px;
            margin-top: 10px;
            border: none;
            border-radius: 7px;
            background: #0b3d62;
            color: white;
            cursor: pointer;
        }

        .instructor {
            background: #f1f1f1;
            padding: 15px;
            margin-top: 12px;
            border-radius: 8px;
        }

        .delete {
            background: #d9534f;
        }

        .back {
            background: white;
            color: #0b3d62;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>NAI GARMAI</h1>
        <p>Instructor Management</p>

        <button class="back" onclick="goDashboard()">
            ← Dashboard
        </button>
    </div>


    <div class="panel">

        <h2>Add Instructor</h2>

        <input
            id="name"
            type="text"
            placeholder="Instructor Full Name"
        >

        <input
            id="id"
            type="text"
            placeholder="Instructor ID"
        >

        <input
            id="subject"
            type="text"
            placeholder="Subject"
        >

        <input
            id="className"
            type="text"
            placeholder="Assigned Class"
        >

        <button onclick="addInstructor()">
            Add Instructor
        </button>

    </div>


    <div class="panel">

        <h2>Instructor Records</h2>

        <div id="instructors"></div>

    </div>

</div>


<script>

let instructors =
    JSON.parse(
        localStorage.getItem("instructors")
    ) || [];


function addInstructor() {

    const name =
        document.getElementById("name").value.trim();

    const id =
        document.getElementById("id").value.trim();

    const subject =
        document.getElementById("subject").value.trim();

    const className =
        document.getElementById("className").value.trim();


    if (
        name === "" ||
        id === "" ||
        subject === "" ||
        className === ""
    ) {

        alert("Please complete all fields.");

        return;
    }


    instructors.push({

        name: name,
        id: id,
        subject: subject,
        className: className

    });


    localStorage.setItem(
        "instructors",
        JSON.stringify(instructors)
    );


    document.getElementById("name").value = "";
    document.getElementById("id").value = "";
    document.getElementById("subject").value = "";
    document.getElementById("className").value = "";


    displayInstructors();

}


function displayInstructors() {

    const container =
        document.getElementById("instructors");

    container.innerHTML = "";


    if (instructors.length === 0) {

        container.innerHTML =
            "<p>No instructors added yet.</p>";

        return;
    }


    instructors.forEach(function(instructor, index) {

        const div =
            document.createElement("div");

        div.className = "instructor";


        div.innerHTML =

            "<strong>Name:</strong> "
            + instructor.name
            + "<br><strong>ID:</strong> "
            + instructor.id
            + "<br><strong>Subject:</strong> "
            + instructor.subject
            + "<br><strong>Class:</strong> "
            + instructor.className
            + "<br><br>"
            + "<button class='delete' onclick='deleteInstructor("
            + index
            + ")'>Delete</button>";


        container.appendChild(div);

    });

}


function deleteInstructor(index) {

    if (
        !confirm(
            "Delete this instructor?"
        )
    ) {

        return;
    }


    instructors.splice(index, 1);


    localStorage.setItem(
        "instructors",
        JSON.stringify(instructors)
    );


    displayInstructors();

}


function goDashboard() {

    window.location.href =
        "index.html";

}


displayInstructors();

</script>

</body>
</html>
