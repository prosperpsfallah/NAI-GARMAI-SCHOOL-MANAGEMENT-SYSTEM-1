<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAI GARMAI Login</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}

.box {
    width: 90%;
    max-width: 380px;
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,.1);
}

h1 {
    text-align: center;
    color: #0b3d62;
}

input {
    width: 100%;
    padding: 13px;
    margin-top: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    box-sizing: border-box;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 18px;
    background: #0b3d62;
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: bold;
}

#message {
    text-align: center;
    margin-top: 15px;
}
</style>
</head>

<body>

<div class="box">

<h1>NAI GARMAI</h1>

<p>School Management System</p>

<input
    id="username"
    type="text"
    placeholder="Username"
>

<input
    id="password"
    type="password"
    placeholder="Password"
>

<button onclick="login()">
LOGIN
</button>

<p id="message"></p>

</div>

<script>

function login() {

    var username =
        document.getElementById("username").value;

    var password =
        document.getElementById("password").value;

    var message =
        document.getElementById("message");


    if (
        username === "admin" &&
        password === "admin123"
    ) {

        localStorage.setItem(
            "loggedIn",
            "true"
        );

        localStorage.setItem(
            "userRole",
            "admin"
        );

        message.innerHTML =
            "Login successful!";

        setTimeout(function() {

            window.location.assign(
                "index.html"
            );

        }, 800);

    } else {

        message.innerHTML =
            "Wrong username or password.";

    }

}

</script>

</body>
</html>
