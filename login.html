<script>

const DEFAULT_STUDENT_PASSWORD = "000000";

function login() {

    const loginType =
        document.getElementById("loginType").value;

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");

    message.textContent = "";
    message.className = "message";

    if (username === "") {
        message.className = "message error";
        message.textContent =
            "Please enter your ID or username.";
        return;
    }

    if (password === "") {
        message.className = "message error";
        message.textContent =
            "Please enter your password.";
        return;
    }


    /* ADMIN LOGIN */

    if (loginType === "admin") {

        const adminUsername =
            localStorage.getItem("adminUsername") || "admin";

        const adminPassword =
            localStorage.getItem("adminPassword") || "admin123";

        if (
            username === adminUsername &&
            password === adminPassword
        ) {

            localStorage.setItem(
                "loggedIn",
                "true"
            );

            localStorage.setItem(
                "userRole",
                "admin"
            );

            localStorage.setItem(
                "currentUser",
                "Administrator"
            );

            message.className =
                "message success";

            message.textContent =
                "Administrator login successful.";

            setTimeout(function() {

                window.location.href =
                    "index.html";

            }, 500);

            return;
        }

        message.className =
            "message error";

        message.textContent =
            "Invalid administrator username or password.";

        return;
    }


    /* STUDENT LOGIN */

    const students =
        JSON.parse(
            localStorage.getItem("students")
        ) || [];

    const student =
        students.find(function(item) {

            return String(
                item.studentId || ""
            ).trim() === username;

        });


    if (!student) {

        message.className =
            "message error";

        message.textContent =
            "Student ID not found.";

        return;
    }


    const studentPassword =
        String(
            student.password ||
            DEFAULT_STUDENT_PASSWORD
        );


    if (password !== studentPassword) {

        message.className =
            "message error";

        message.textContent =
            "Incorrect password.";

        return;
    }


    /* SAVE STUDENT SESSION */

    localStorage.setItem(
        "loggedIn",
        "true"
    );

    localStorage.setItem(
        "userRole",
        "student"
    );

    localStorage.setItem(
        "currentStudentId",
        String(student.studentId)
    );

    localStorage.setItem(
        "currentStudentName",
        student.name ||
        student.fullName ||
        ""
    );


    message.className =
        "message success";

    message.textContent =
        "Login successful. Opening student portal...";


    /* IMPORTANT:
       Your file is portal.html
    */

    setTimeout(function() {

        window.location.href =
            "portal.html";

    }, 500);

}


function togglePassword() {

    const password =
        document.getElementById("password");

    const button =
        document.querySelector(".showPassword");


    if (password.type === "password") {

        password.type = "text";
        button.textContent = "Hide";

    } else {

        password.type = "password";
        button.textContent = "Show";

    }

}


document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            login();
        }

    }
);

</script>
