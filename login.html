<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAI GARMAI | Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #071a2f, #0b3d62);
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);
        }

        .logo {
            width: 75px;
            height: 75px;
            margin: 0 auto 15px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b3d62;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            color: #0b3d62;
            font-size: 24px;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #ddd;
            border-radius: 9px;
            font-size: 15px;
            background: white;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #0b3d62;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #0b3d62;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #888;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="logo">NG</div>

    <h1>NAI GARMAI</h1>

    <p class="subtitle">
        School System Management
    </p>

    <form id="loginForm">

        <label for="role">Login As</label>

        <select id="role" required>
            <option value="">Select role</option>
            <option value="admin">Administrator</option>
            <option value="instructor">Instructor</option>
        </select>


        <label for="username">Username</label>

        <input
            id="username"
            type="text"
            placeholder="Enter username"
            autocomplete="username"
            required
        >


        <label for="password">Password</label>

        <input
            id="password"
            type="password"
            placeholder="Enter password"
            autocomplete="current-password"
            required
        >


        <button type="submit">
            Login
        </button>

        <div id="message"></div>

    </form>

    <div class="footer">
        © 2026 NAI GARMAI SCHOOL SYSTEM
    </div>

</div>


<script>

document.getElementById("loginForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const role = document.getElementById("role").value;
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    const message = document.getElementById("message");


    /* =========================
       DEMO LOGIN CREDENTIALS
       ========================= */

    const adminUsername = "admin";
    const adminPassword = "admi2000";

    const instructorUsername = "instructor";
    const instructorPassword = "teacher1999";


    /* =========================
       ADMINISTRATOR LOGIN
       ========================= */

    if (
        role === "admin" &&
        username === adminUsername &&
        password === adminPassword
    ) {

        localStorage.setItem("userRole", "admin");
        localStorage.setItem("loggedIn", "true");

        window.location.href = "Index.html";

        return;
    }


    /* =========================
       INSTRUCTOR LOGIN
       ========================= */

    if (
        role === "instructor" &&
        username === instructorUsername &&
        password === instructorPassword
    ) {

        localStorage.setItem("userRole", "instructor");
        localStorage.setItem("loggedIn", "true");

        window.location.href = "Index.html";

        return;
    }


    /* =========================
       INVALID LOGIN
       ========================= */

    message.style.color = "red";

    message.textContent = "Invalid login details.";

});

</script>

</body>
</html>
