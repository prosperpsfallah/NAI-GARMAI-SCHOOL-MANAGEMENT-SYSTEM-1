<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NAI GARMAI Login</title>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.login-box {
    width: 90%;
    max-width: 400px;
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,.1);
}

h1 {
    text-align: center;
    color: #0b3d62;
}

p {
    text-align: center;
    color: #777;
}

label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
}

input,
select {
    width: 100%;
    padding: 12px;
    margin-top: 7px;
    border: 1px solid #ccc;
    border-radius: 8px;
}

button {
    width: 100%;
    margin-top: 20px;
    padding: 13px;
    background: #0b3d62;
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: bold;
}

</style>

</head>

<body>

<div class="login-box">

<h1>
NAI GARMAI
</h1>

<p>
School Management System
</p>

<label>
Login Type
</label>

<select>

<option>
Administrator
</option>

<option>
Student
</option>

</select>

<label>
Username / Student ID
</label>

<input
type="text"
placeholder="Enter username or Student ID"
>

<label>
Password
</label>

<input
type="password"
placeholder="Enter password"
>

<button>
LOGIN
</button>

</div>

</body>

</html>
