<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>NAI GARMAI | Login</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 20px;

    font-family: Arial, sans-serif;

    background: #f4f7fb;

    display: flex;
    align-items: center;
    justify-content: center;
}

.login-box {
    width: 100%;
    max-width: 420px;

    background: white;

    padding: 30px;

    border-radius: 16px;

    box-shadow:
        0 8px 30px
        rgba(0,0,0,.10);
}

.logo {
    width: 70px;
    height: 70px;

    margin: 0 auto 15px;

    border-radius: 50%;

    background: #0b3d62;

    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 24px;
    font-weight: bold;
}

h1 {
    margin: 0;

    text-align: center;

    color: #0b3d62;
}

.subtitle {
    text-align: center;

    color: #777;

    margin-bottom: 25px;
}

label {
    display: block;

    margin-top: 15px;
    margin-bottom: 7px;

    font-weight: bold;
}

select,
input {
    width: 100%;

    padding: 13px;

    border: 1px solid #ccc;

    border-radius: 8px;

    font-size: 15px;
}

button {
    width: 100%;

    margin-top: 22px;

    padding: 14px;

    border: none;

    border-radius: 8px;

    background: #0b3d62;

    color: white;

    font-size: 16px;

    font-weight: bold;
}

.message {
    min-height: 22px;

    margin-top: 15px;

    text-align: center;

    font-weight: bold;
}

.test-info {
    margin-top: 20px;

    padding: 12px;

    background: #f4f7fb;

    border-radius: 8px;

    font-size: 12px;

    color: #666;

    line-height: 1.6;
}

</style>

</head>

<body>


<div class="login-box">


<div class="logo">
NG
</div>


<h1>
NAI GARMAI
</h1>


<p class="subtitle">
School Management System
</p>


<label>
Login As
</label>


<select id="loginType">

<option value="admin">
Administrator
</option>

<option value="instructor">
Instructor
</option>

<option value="student">
Student
</option>

</select>


<label>
Username / ID
</label>


<input
    id="username"
    type="text"
    placeholder="Enter username or ID"
>


<label>
Password
</label>


<input
    id="password"
    type="password"
    placeholder="Enter password"
>


<button
    onclick="login()"
>
LOGIN
</button>


<div
    id="message"
    class="message"
></div>


<div class="test-info">

<b>Test accounts</b><br>

Administrator:
admin / admin123<br>

Instructor:
instructor / instructor123<br>

Student:
student / student123

</div>


</div>


<script>

function login() {


var type =
    document.getElementById(
        "loginType"
    ).value;


var username =
    document.getElementById(
        "username"
    ).value.trim();


var password =
    document.getElementById(
        "password"
    ).value;


var message =
    document.getElementById(
        "message"
    );


message.textContent = "";


/*
========================================
CHECK EMPTY FIELDS
========================================
*/

if (
    username === ""
    ||
    password === ""
) {

    message.textContent =
        "Please enter your username and password.";

    message.style.color =
        "#d9534f";

    return;

}


/*
========================================
ADMINISTRATOR
========================================
*/

if (
    type === "admin"
) {


if (
    username === "admin"
    &&
    password === "admin123"
) {


localStorage.setItem(
    "loggedIn",
    "true"
);


localStorage.setItem(
    "userRole",
    "admin"
);


localStorage.setItem(
    "currentUser",
    "Administrator"
);


message.textContent =
    "Administrator login successful.";


message.style.color =
    "#198754";


setTimeout(
    function() {

        window.location.href =
            "index.html";

    },
    500
);


return;

}


message.textContent =
    "Invalid Administrator login.";

message.style.color =
    "#d9534f";

return;

}


/*
========================================
INSTRUCTOR
========================================
*/

if (
    type === "instructor"
) {


if (
    username === "instructor"
    &&
    password === "instructor123"
) {


localStorage.setItem(
    "loggedIn",
    "true"
);


localStorage.setItem(
    "userRole",
    "instructor"
);


localStorage.setItem(
    "currentUser",
    "Instructor"
);


message.textContent =
    "Instructor login successful.";


message.style.color =
    "#198754";


setTimeout(
    function() {

        window.location.href =
            "instructor-dashboard.html";

    },
    500
);


return;

}


message.textContent =
    "Invalid Instructor login.";

message.style.color =
    "#d9534f";

return;

}


/*
========================================
STUDENT
========================================
*/

if (
    type === "student"
) {


if (
    username === "student"
    &&
    password === "student123"
) {


localStorage.setItem(
    "loggedIn",
    "true"
);


localStorage.setItem(
    "userRole",
    "student"
);


localStorage.setItem(
    "currentUser",
    "Student"
);


message.textContent =
    "Student login successful.";


message.style.color =
    "#198754";


setTimeout(
    function() {

        window.location.href =
            "student-dashboard.html";

    },
    500
);


return;

}


message.textContent =
    "Invalid Student login.";

message.style.color =
    "#d9534f";

return;

}

}

</script>


</body>

</html>
