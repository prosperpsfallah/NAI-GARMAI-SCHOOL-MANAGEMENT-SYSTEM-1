<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NAI GARMAI | Students</title>

<style>

* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 1000px;
    margin: auto;
}

.header {
    background: #0b3d62;
    color: white;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
}

.header h1 {
    margin: 0 0 5px;
}

.panel {
    background: white;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

input {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border: 1px solid #ddd;
    border-radius: 7px;
    font-size: 15px;
}

button {
    padding: 12px 18px;
    margin-top: 10px;
    border: none;
    border-radius: 7px;
    background: #0b3d62;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

.back {
    background: white;
    color: #0b3d62;
}

.delete {
    background: #d9534f;
    margin-left: 8px;
}

.student {
    background: #f1f1f1;
    padding: 15px;
    margin-top: 12px;
    border-radius: 8px;
}

.success {
    color: #198754;
    font-weight: bold;
    margin-top: 12px;
}

.error {
    color: #d9534f;
    font-weight: bold;
    margin-top: 12px;
}

.notice {
    background: #eef5fa;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 15px;
    color: #555;
}

</style>

</head>

<body>

<div class="container">

<!-- HEADER -->

<div class="header">

<h1>NAI GARMAI SCHOOL SYSTEM</h1>

<p>Student Management</p>

<button
class="back"
onclick="goDashboard()"
>
← Dashboard
</button>

</div>


<!-- ADD STUDENT -->

<div
class="panel"
id="studentForm"
>

<h2>Add Student</h2>

<div class="notice">

Create the student's school account here.
The username and password will be used to enter the Student Portal.

</div>

<input
id="studentName"
type="text"
placeholder="Student Full Name"
>

<input
id="studentId"
type="text"
placeholder="Student ID (Example: NG001)"
>

<input
id="studentUsername"
type="text"
placeholder="Student Username"
>

<input
id="studentPassword"
type="password"
placeholder="Student Password"
>

<input
id="studentClass"
type="text"
placeholder="Class / Grade"
>

<input
id="studentPhone"
type="text"
placeholder="Parent / Guardian Phone"
>

<button onclick="addStudent()">
Add Student
</button>

<div id="message"></div>

</div>


<!-- STUDENT RECORDS -->

<div class="panel">

<h2>Student Records</h2>

<div id="students">

<p>Loading students...</p>

</div>

</div>

</div>


<script>

/*
==================================================
USER ROLE
==================================================
*/

const role =
localStorage.getItem("userRole");


/*
==================================================
LOAD STUDENTS
==================================================
*/

let students =
JSON.parse(
localStorage.getItem("students")
) || [];


/*
==================================================
ROLE PERMISSIONS
==================================================
*/

function setupRole() {

const form =
document.getElementById("studentForm");

if (role === "admin") {

form.style.display = "block";

} else {

form.style.display = "none";

}

}


/*
==================================================
ADD STUDENT
==================================================
*/

function addStudent() {

if (role !== "admin") {

alert(
"Only the Administrator can add students."
);

return;

}


const name =
document
.getElementById("studentName")
.value
.trim();


const studentId =
document
.getElementById("studentId")
.value
.trim();


const username =
document
.getElementById("studentUsername")
.value
.trim();


const password =
document
.getElementById("studentPassword")
.value;


const studentClass =
document
.getElementById("studentClass")
.value
.trim();


const phone =
document
.getElementById("studentPhone")
.value
.trim();


const message =
document.getElementById("message");


message.textContent = "";


/*
VALIDATION
*/

if (
name === "" ||
studentId === "" ||
username === "" ||
password === "" ||
studentClass === ""
) {

message.className = "error";

message.textContent =
"Please complete all required fields.";

return;

}


/*
CHECK STUDENT ID
*/

const existingId =
students.find(
function(student) {

return String(
student.studentId
) === String(studentId);

});


if (existingId) {

message.className = "error";

message.textContent =
"Student ID already exists.";

return;

}


/*
CHECK USERNAME
*/

const existingUsername =
students.find(
function(student) {

return String(
student.username
).toLowerCase()
===
String(username).toLowerCase();

});


if (existingUsername) {

message.className = "error";

message.textContent =
"Student username already exists.";

return;

}


/*
CREATE STUDENT
*/

const newStudent = {

name: name,

studentId: studentId,

username: username,

password: password,

studentClass: studentClass,

phone: phone

};


/*
SAVE
*/

students.push(newStudent);

localStorage.setItem(
"students",
JSON.stringify(students)
);


/*
CLEAR FORM
*/

document.getElementById(
"studentName"
).value = "";

document.getElementById(
"studentId"
).value = "";

document.getElementById(
"studentUsername"
).value = "";

document.getElementById(
"studentPassword"
).value = "";

document.getElementById(
"studentClass"
).value = "";

document.getElementById(
"studentPhone"
).value = "";


message.className = "success";

message.textContent =
"Student account created successfully.";


/*
REFRESH RECORDS
*/

displayStudents();

}


/*
==================================================
DISPLAY STUDENTS
==================================================
*/

function displayStudents() {

const container =
document.getElementById("students");

container.innerHTML = "";


if (students.length === 0) {

container.innerHTML =
"<p>No students registered yet.</p>";

return;

}


students.forEach(
function(student, index) {

const div =
document.createElement("div");

div.className = "student";


div.innerHTML =

"<strong>Student Name:</strong> "
+
escapeHTML(student.name)

+

"<br><strong>Student ID:</strong> "
+
escapeHTML(student.studentId)

+

"<br><strong>Username:</strong> "
+
escapeHTML(student.username)

+

"<br><strong>Class / Grade:</strong> "
+
escapeHTML(student.studentClass)

+

"<br><strong>Parent / Guardian Phone:</strong> "
+
escapeHTML(
student.phone ||
"Not provided"
);


/*
ADMIN DELETE
*/

if (role === "admin") {

const deleteButton =
document.createElement("button");

deleteButton.className = "delete";

deleteButton.textContent =
"Delete";

deleteButton.onclick =
function() {

deleteStudent(index);

};

div.appendChild(
document.createElement("br")
);

div.appendChild(
deleteButton
);

}


container.appendChild(div);

});

}


/*
==================================================
DELETE STUDENT
==================================================
*/

function deleteStudent(index) {

if (role !== "admin") {

return;

}


const confirmed =
confirm(
"Are you sure you want to delete this student?"
);


if (!confirmed) {

return;

}


students.splice(index, 1);


localStorage.setItem(
"students",
JSON.stringify(students)
);


displayStudents();

}


/*
==================================================
DASHBOARD
==================================================
*/

function goDashboard() {

window.location.href =
"index.html";

}


/*
==================================================
HTML SECURITY
==================================================
*/

function escapeHTML(value) {

return String(value ?? "")

.replace(/&/g, "&amp;")

.replace(/</g, "&lt;")

.replace(/>/g, "&gt;")

.replace(/"/g, "&quot;")

.replace(/'/g, "&#039;");

}


/*
==================================================
START
==================================================
*/

setupRole();

displayStudents();

</script>

</body>

</html>
