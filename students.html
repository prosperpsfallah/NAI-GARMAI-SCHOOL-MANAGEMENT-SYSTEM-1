<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>NAI GARMAI | Students</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #222;
}

.container {
    max-width: 1100px;
    margin: auto;
}

.header {
    background: #0b3d62;
    color: white;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
}

.header h1 {
    margin: 0 0 6px;
}

.header p {
    margin: 0 0 15px;
}

button {
    border: none;
    border-radius: 7px;
    padding: 12px 18px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

.back {
    background: white;
    color: #0b3d62;
}

.add {
    background: #198754;
    color: white;
}

.edit {
    background: #0b3d62;
    color: white;
    margin-right: 6px;
}

.delete {
    background: #d9534f;
    color: white;
}

.reset {
    background: #d97706;
    color: white;
    margin-right: 6px;
}

.save {
    background: #198754;
    color: white;
    margin-right: 8px;
}

.cancel {
    background: #6c757d;
    color: white;
}

.panel {
    background: white;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.panelHeader {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
}

.panel h2 {
    margin: 0;
    color: #0b3d62;
}

.formPanel {
    display: none;
}

.formPanel.show {
    display: block;
}

label {
    display: block;
    margin-top: 12px;
    font-weight: bold;
}

input,
select {
    width: 100%;
    padding: 12px;
    margin-top: 7px;
    border: 1px solid #ddd;
    border-radius: 7px;
    font-size: 15px;
}

input:focus,
select:focus {
    outline: none;
    border-color: #0b3d62;
}

.readonly {
    background: #eef2f5;
    color: #555;
}

.formActions {
    margin-top: 15px;
}

.message {
    margin-top: 12px;
    font-weight: bold;
}

.success {
    color: #198754;
}

.error {
    color: #d9534f;
}

.search {
    margin-bottom: 15px;
}

.studentCard {
    background: #f8fafc;
    border-left: 4px solid #0b3d62;
    border-radius: 9px;
    padding: 18px;
    margin-top: 12px;
}

.studentCard h3 {
    margin: 0 0 10px;
    color: #0b3d62;
}

.studentCard p {
    margin: 6px 0;
}

.actions {
    margin-top: 12px;
}

.empty {
    color: #777;
}

.adminNotice {
    background: #eaf7ee;
    color: #245c35;
    padding: 12px;
    border-radius: 8px;
    margin-top: 15px;
}

.passwordBox {
    background: #fff7e6;
    border: 1px solid #f0d28a;
    padding: 12px;
    border-radius: 8px;
    margin-top: 12px;
}

.passwordDefault {
    color: #d97706;
    font-weight: bold;
}

.passwordChanged {
    color: #198754;
    font-weight: bold;
}

@media (max-width: 600px) {

    body {
        padding: 10px;
    }

    .panel {
        padding: 15px;
    }

    .header {
        padding: 15px;
    }

    button {
        width: 100%;
        margin-top: 8px;
    }

    .edit,
    .delete,
    .reset {
        width: auto;
    }

}

</style>

</head>

<body>

<div class="container">

<!-- HEADER -->

<div class="header">

<h1>
NAI GARMAI SCHOOL SYSTEM
</h1>

<p>
Student Management
</p>

<button
class="back"
onclick="goDashboard()"
>
← Dashboard
</button>

</div>


<!-- ADMIN NOTICE -->

<div class="panel">

<h2>
Student Management
</h2>

<div class="adminNotice">

<strong>Administrator access:</strong>

You can register students, edit student
information, reset student passwords and
delete student records.

</div>

</div>


<!-- ADD STUDENT -->

<div class="panel">

<div class="panelHeader">

<h2>
Register Student
</h2>

<button
class="add"
onclick="openAddForm()"
>
+ Add Student
</button>

</div>

</div>


<!-- STUDENT FORM -->

<div
class="panel formPanel"
id="studentFormPanel"
>

<h2 id="formTitle">
Register New Student
</h2>


<label>
Student ID
</label>

<input
id="studentId"
type="text"
class="readonly"
readonly
placeholder="Automatically generated"
>


<label>
Full Name
</label>

<input
id="studentName"
type="text"
placeholder="Enter student's full name"
>


<label>
Date of Birth
</label>

<input
id="studentDOB"
type="date"
>


<label>
Gender
</label>

<select id="studentGender">

<option value="">
Select gender
</option>

<option value="Male">
Male
</option>

<option value="Female">
Female
</option>

<option value="Other">
Other
</option>

</select>


<label>
Class / Grade
</label>

<input
id="studentClass"
type="text"
placeholder="Example: Grade 10"
>


<label>
Phone Number
</label>

<input
id="studentPhone"
type="tel"
placeholder="Enter phone number"
>


<label>
Parent / Guardian Name
</label>

<input
id="guardianName"
type="text"
placeholder="Enter parent or guardian name"
>


<label>
Parent / Guardian Phone
</label>

<input
id="guardianPhone"
type="tel"
placeholder="Enter guardian phone number"
>


<div class="formActions">

<button
class="save"
onclick="saveStudent()"
>
Save Student
</button>

<button
class="cancel"
onclick="closeStudentForm()"
>
Cancel
</button>

</div>


<div
id="formMessage"
class="message"
></div>

</div>


<!-- STUDENTS LIST -->

<div class="panel">

<div class="panelHeader">

<h2>
Registered Students
</h2>

</div>


<input
class="search"
id="searchInput"
type="search"
placeholder="Search by name, ID, class or phone..."
oninput="displayStudents()"
>


<div id="studentsList">

<p class="empty">
Loading students...
</p>

</div>

</div>

</div>


<script>

/*
==================================================
LOGIN SECURITY
==================================================
*/

const loggedIn =
localStorage.getItem("loggedIn");

const role =
localStorage.getItem("userRole");


if (loggedIn !== "true") {

    window.location.href = "login.html";

}


/*
==================================================
ADMIN SECURITY
==================================================
*/

if (role !== "admin") {

    alert(
        "Only the Administrator can manage students."
    );

    window.location.href = "index.html";

}


/*
==================================================
DEFAULT STUDENT PASSWORD
==================================================
*/

const DEFAULT_STUDENT_PASSWORD = "000000";


/*
==================================================
LOAD STUDENTS
==================================================
*/

let students =
    JSON.parse(
        localStorage.getItem("students")
    ) || [];


/*
==================================================
EDIT MODE
==================================================
*/

let editingIndex = -1;


/*
==================================================
GENERATE UNIQUE 6-DIGIT STUDENT ID
==================================================
*/

function generateStudentId() {

    let id;

    let exists = true;

    while (exists) {

        id =
            String(
                Math.floor(
                    100000 +
                    Math.random() * 900000
                )
            );

        exists =
            students.some(
                function(student) {

                    return String(
                        student.studentId || ""
                    ) === id;

                }
            );

    }

    return id;

}


/*
==================================================
OPEN ADD FORM
==================================================
*/

function openAddForm() {

    editingIndex = -1;

    document.getElementById(
        "formTitle"
    ).textContent =
        "Register New Student";

    clearForm();

    document.getElementById(
        "studentId"
    ).value =
        generateStudentId();

    document.getElementById(
        "studentFormPanel"
    ).classList.add("show");

    document.getElementById(
        "formMessage"
    ).textContent = "";

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/*
==================================================
OPEN EDIT FORM
==================================================
*/

function openEditForm(index) {

    if (role !== "admin") {

        alert(
            "Only the Administrator can edit students."
        );

        return;

    }

    const student =
        students[index];

    if (!student) {
        return;
    }

    editingIndex = index;

    document.getElementById(
        "formTitle"
    ).textContent =
        "Edit Student";

    document.getElementById(
        "studentId"
    ).value =
        student.studentId || "";

    document.getElementById(
        "studentName"
    ).value =
        student.name ||
        student.fullName ||
        "";

    document.getElementById(
        "studentDOB"
    ).value =
        student.dateOfBirth || "";

    document.getElementById(
        "studentGender"
    ).value =
        student.gender || "";

    document.getElementById(
        "studentClass"
    ).value =
        student.className || "";

    document.getElementById(
        "studentPhone"
    ).value =
        student.phone || "";

    document.getElementById(
        "guardianName"
    ).value =
        student.guardianName || "";

    document.getElementById(
        "guardianPhone"
    ).value =
        student.guardianPhone || "";

    document.getElementById(
        "formMessage"
    ).textContent = "";

    document.getElementById(
        "studentFormPanel"
    ).classList.add("show");

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/*
==================================================
CLOSE FORM
==================================================
*/

function closeStudentForm() {

    editingIndex = -1;

    document.getElementById(
        "studentFormPanel"
    ).classList.remove("show");

    clearForm();

    document.getElementById(
        "formMessage"
    ).textContent = "";

}


/*
==================================================
CLEAR FORM
==================================================
*/

function clearForm() {

    document.getElementById(
        "studentId"
    ).value = "";

    document.getElementById(
        "studentName"
    ).value = "";

    document.getElementById(
        "studentDOB"
    ).value = "";

    document.getElementById(
        "studentGender"
    ).value = "";

    document.getElementById(
        "studentClass"
    ).value = "";

    document.getElementById(
        "studentPhone"
    ).value = "";

    document.getElementById(
        "guardianName"
    ).value = "";

    document.getElementById(
        "guardianPhone"
    ).value = "";

}


/*
==================================================
SAVE STUDENT
==================================================
*/

function saveStudent() {

    if (role !== "admin") {

        alert(
            "Only the Administrator can add or edit students."
        );

        return;

    }

    const studentId =
        document.getElementById(
            "studentId"
        ).value.trim();

    const name =
        document.getElementById(
            "studentName"
        ).value.trim();

    const dateOfBirth =
        document.getElementById(
            "studentDOB"
        ).value;

    const gender =
        document.getElementById(
            "studentGender"
        ).value;

    const className =
        document.getElementById(
            "studentClass"
        ).value.trim();

    const phone =
        document.getElementById(
            "studentPhone"
        ).value.trim();

    const guardianName =
        document.getElementById(
            "guardianName"
        ).value.trim();

    const guardianPhone =
        document.getElementById(
            "guardianPhone"
        ).value.trim();

    const message =
        document.getElementById(
            "formMessage"
        );

    message.textContent = "";


    /*
    VALIDATION
    */

    if (name === "") {

        message.className =
            "message error";

        message.textContent =
            "Please enter the student's full name.";

        return;

    }


    if (gender === "") {

        message.className =
            "message error";

        message.textContent =
            "Please select the student's gender.";

        return;

    }


    if (className === "") {

        message.className =
            "message error";

        message.textContent =
            "Please enter the student's class or grade.";

        return;

    }


    /*
    CREATE STUDENT DATA
    */

    const studentData = {

        studentId:
            studentId || generateStudentId(),

        name:
            name,

        fullName:
            name,

        dateOfBirth:
            dateOfBirth,

        gender:
            gender,

        className:
            className,

        phone:
            phone,

        guardianName:
            guardianName,

        guardianPhone:
            guardianPhone

    };


    /*
    EDIT EXISTING STUDENT
    */

    if (editingIndex !== -1) {

        const oldStudent =
            students[editingIndex];

        studentData.createdAt =
            oldStudent.createdAt ||
            new Date().toISOString();

        studentData.password =
            oldStudent.password ||
            DEFAULT_STUDENT_PASSWORD;

        studentData.passwordChanged =
            oldStudent.passwordChanged === true;

        studentData.updatedAt =
            new Date().toISOString();

        students[editingIndex] =
            studentData;

        saveStudents();

        message.className =
            "message success";

        message.textContent =
            "Student updated successfully.";

        displayStudents();

        setTimeout(
            function() {
                closeStudentForm();
            },
            700
        );

        return;

    }


    /*
    NEW STUDENT
    */

    studentData.createdAt =
        new Date().toISOString();

    /*
    EVERY NEW STUDENT GETS:
    000000
    */

    studentData.password =
        DEFAULT_STUDENT_PASSWORD;

    studentData.passwordChanged =
        false;


    students.push(
        studentData
    );

    saveStudents();


    message.className =
        "message success";

    message.textContent =
        "Student registered successfully. Student password: 000000";


    displayStudents();


    setTimeout(
        function() {
            closeStudentForm();
        },
        1200
    );

}


/*
==================================================
RESET STUDENT PASSWORD
==================================================
*/

function resetStudentPassword(index) {

    if (role !== "admin") {

        alert(
            "Only the Administrator can reset passwords."
        );

        return;

    }

    const student =
        students[index];

    if (!student) {
        return;
    }

    const name =
        student.name ||
        student.fullName ||
        "this student";

    const confirmed =
        confirm(
            "Reset the password for "
            +
            name
            +
            "?\n\n"
            +
            "The new password will be:\n"
            +
            "000000"
        );

    if (!confirmed) {
        return;
    }


    student.password =
        DEFAULT_STUDENT_PASSWORD;

    student.passwordChanged =
        false;

    student.passwordResetAt =
        new Date().toISOString();

    student.passwordResetBy =
        "Administrator";


    saveStudents();

    alert(
        "Password reset successfully.\n\n"
        +
        "Student ID: "
        +
        student.studentId
        +
        "\n"
        +
        "New Password: 000000"
    );

    displayStudents();

}


/*
==================================================
DELETE STUDENT
==================================================
*/

function deleteStudent(index) {

    if (role !== "admin") {

        alert(
            "Only the Administrator can delete students."
        );

        return;

    }

    const student =
        students[index];

    if (!student) {
        return;
    }

    const name =
        student.name ||
        student.fullName ||
        "this student";

    const confirmed =
        confirm(
            "Are you sure you want to delete "
            +
            name
            +
            "?\n\nThis action cannot be undone."
        );

    if (!confirmed) {
        return;
    }


    students.splice(
        index,
        1
    );

    saveStudents();

    displayStudents();

}


/*
==================================================
SAVE STUDENTS
==================================================
*/

function saveStudents() {

    localStorage.setItem(
        "students",
        JSON.stringify(students)
    );

}


/*
==================================================
DISPLAY STUDENTS
==================================================
*/

function displayStudents() {

    const container =
        document.getElementById(
            "studentsList"
        );

    const search =
        document.getElementById(
            "searchInput"
        ).value
        .trim()
        .toLowerCase();

    container.innerHTML = "";

    let filteredStudents =
        students;


    if (search !== "") {

        filteredStudents =
            students.filter(
                function(student) {

                    const text =
                        String(
                            student.studentId || ""
                        )
                        + " " +
                        String(
                            student.name ||
                            student.fullName ||
                            ""
                        )
                        + " " +
                        String(
                            student.className || ""
                        )
                        + " " +
                        String(
                            student.phone || ""
                        );

                    return text
                        .toLowerCase()
                        .includes(search);

                }
            );

    }


    if (filteredStudents.length === 0) {

        container.innerHTML =
            "<p class='empty'>"
            +
            (
                search
                ?
                "No students match your search."
                :
                "No students registered yet."
            )
            +
            "</p>";

        return;

    }


    filteredStudents.forEach(
        function(student) {

            const realIndex =
                students.indexOf(student);

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "studentCard";


            const name =
                student.name ||
                student.fullName ||
                "Unknown Student";


            card.innerHTML =

                "<h3>"
                +
                escapeHTML(name)
                +
                "</h3>"

                +

                "<p>"
                +
                "<strong>Student ID:</strong> "
                +
                escapeHTML(
                    student.studentId ||
                    "Unknown"
                )
                +
                "</p>"

                +

                "<p>"
                +
                "<strong>Class:</strong> "
                +
                escapeHTML(
                    student.className ||
                    "Not provided"
                )
                +
                "</p>"

                +

                "<p>"
                +
                "<strong>Gender:</strong> "
                +
                escapeHTML(
                    student.gender ||
                    "Not provided"
                )
                +
                "</p>"

                +

                "<p>"
                +
                "<strong>Date of Birth:</strong> "
                +
                escapeHTML(
                    student.dateOfBirth ||
                    "Not provided"
                )
                +
                "</p>"

                +

                "<p>"
                +
                "<strong>Phone:</strong> "
                +
                escapeHTML(
                    student.phone ||
                    "Not provided"
                )
                +
                "</p>"

                +

                "<p>"
                +
                "<strong>Parent/Guardian:</strong> "
                +
                escapeHTML(
                    student.guardianName ||
                    "Not provided"
                )
                +
                "</p>"

                +

                "<p>"
                +
                "<strong>Guardian Phone:</strong> "
                +
                escapeHTML(
                    student.guardianPhone ||
                    "Not provided"
                )
                +
                "</p>";


            /*
            PASSWORD STATUS
            */

            const passwordBox =
                document.createElement(
                    "div"
                );

            passwordBox.className =
                "passwordBox";


            const status =
                student.passwordChanged === true
                ?
                "Student has changed their password."
                :
                "Default password: 000000";


            passwordBox.innerHTML =

                "<strong>Portal Password Status:</strong><br>"
                +

                "<span class='"
                +
                (
                    student.passwordChanged === true
                    ?
                    "passwordChanged"
                    :
                    "passwordDefault"
                )
                +
                "'>"
                +
                escapeHTML(status)
                +
                "</span>";


            card.appendChild(
                passwordBox
            );


            /*
            ACTIONS
            */

            const actions =
                document.createElement(
                    "div"
                );

            actions.className =
                "actions";


            /*
            EDIT BUTTON
            */

            const editButton =
                document.createElement(
                    "button"
                );

            editButton.className =
                "edit";

            editButton.textContent =
                "Edit";

            editButton.onclick =
                function() {

                    openEditForm(
                        realIndex
                    );

                };


            /*
            RESET PASSWORD BUTTON
            */

            const resetButton =
                document.createElement(
                    "button"
                );

            resetButton.className =
                "reset";

            resetButton.textContent =
                "Reset Password";

            resetButton.onclick =
                function() {

                    resetStudentPassword(
                        realIndex
                    );

                };


            /*
            DELETE BUTTON
            */

            const deleteButton =
                document.createElement(
                    "button"
                );

            deleteButton.className =
                "delete";

            deleteButton.textContent =
                "Delete";

            deleteButton.onclick =
                function() {

                    deleteStudent(
                        realIndex
                    );

                };


            actions.appendChild(
                editButton
            );

            actions.appendChild(
                resetButton
            );

            actions.appendChild(
                deleteButton
            );

            card.appendChild(
                actions
            );

            container.appendChild(
                card
            );

        }
    );

}


/*
==================================================
DASHBOARD
==================================================
*/

function goDashboard() {

    window.location.href =
        "index.html";

}


/*
==================================================
HTML SECURITY
==================================================
*/

function escapeHTML(value) {

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/*
==================================================
START
==================================================
*/

displayStudents();

</script>

</body>

</html>
