<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NAI GARMAI Dashboard</title>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7fb;
}

header {
    background: #0b3d62;
    color: white;
    padding: 20px;
}

main {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
}

.card {
    background: white;
    padding: 20px;
    margin-bottom: 15px;
    border-radius: 10px;
}

button {
    padding: 10px 15px;
    border: 0;
    border-radius: 7px;
    background: #0b3d62;
    color: white;
}

</style>

</head>

<body>

<header>

<h1>
NAI GARMAI SCHOOL SYSTEM
</h1>

</header>

<main>

<div class="card">

<h2>
Administrator Dashboard
</h2>

<p>
Welcome to the NAI GARMAI School Management System.
</p>

</div>

<div class="card">

<h3>
Students
</h3>

<p>
Manage student records.
</p>

<button
onclick="window.location.href='students.html'"
>
Open Students
</button>

</div>

<div class="card">

<h3>
Instructors
</h3>

<p>
Manage instructors.
</p>

<button
onclick="window.location.href='instructors.html'"
>
Open Instructors
</button>

</div>

<div class="card">

<h3>
Attendance
</h3>

<p>
Manage student attendance.
</p>

<button
onclick="window.location.href='attendance.html'"
>
Open Attendance
</button>

</div>

<div class="card">

<h3>
Grades
</h3>

<p>
Manage student grades.
</p>

<button
onclick="window.location.href='grades.html'"
>
Open Grades
</button>

</div>

<div class="card">

<h3>
Reports
</h3>

<p>
View school reports.
</p>

<button
onclick="window.location.href='reports.html'"
>
Open Reports
</button>

</div>

</main>

</body>

</html>
