<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAI GARMAI School Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>NAI GARMAI SCHOOL</h1>
        <p>School Management System</p>
    </header>

    <main class="container">

        <h2>Dashboard</h2>

        <div class="dashboard">

            <div class="card">
                <h3>Students</h3>
                <p>Manage student records</p>
                <button>View Students</button>
            </div>

            <div class="card">
                <h3>Instructors</h3>
                <p>Manage instructors</p>
                <button>View Instructors</button>
            </div>

            <div class="card">
                <h3>Grades</h3>
                <p>Review and approve grades</p>
                <button>View Grades</button>
            </div>

            <div class="card">
                <h3>Attendance</h3>
                <p>Monitor student attendance</p>
                <button>View Attendance</button>
            </div>

        </div>

    </main>

</body>
</html>
