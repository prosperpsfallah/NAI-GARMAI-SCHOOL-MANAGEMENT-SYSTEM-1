<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>NAI GARMAI | Login</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #f4f7fb;
}

.login-box {
    width: 100%;
    max-width: 420px;
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 5px 25px rgba(0,0,0,.10);
}

h1 {
    margin: 0;
    text-align: center;
    color: #0b3d62;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 25px;
}

label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
    color: #333;
}

select,
input {
    width: 100%;
    padding: 13px;
    margin-top: 7px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
}

input:focus,
select:focus {
    outline: none;
    border-color: #0b3d62;
}

.password-row {
    position: relative;
}

.password-row input {
    padding-right: 70px;
}

.showPassword {
    position: absolute;
    right: 8px;
    bottom: 7px;
    border: none;
    background: #eee;
    padding: 7px 10px;
    border-radius: 6px;
    cursor: pointer;
}

.login-button {
    width: 100%;
    margin-top: 22px;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: #0b3d62;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.login-button:hover {
    opacity: .9;
}

.message {
    margin-top: 15px;
    text-align: center;
    font-weight: bold;
}

.success {
    color: #198754;
}

.error {
    color: #d9534f;
}

.note {
    margin-top: 20px;
    padding: 12px;
    background: #f8fafc;
    border-radius: 8px;
    color: #666;
    font-size: 13px;
    text-align: center;
}

</style>

</head>

<body>


<div class="login-box">

<h1>
NAI GARMAI
</h1>

<p class="subtitle">
School Management System
</p>


<label>
Login As
</label>

<select id="loginType">

<option value="admin">
Administrator
</option>

<option value="student">
Student
</option>

</select>


<label>
Student ID / Username
</label>

<input
    id="username"
    type="text"
    placeholder="Enter your ID or username"
    autocomplete="username"
>


<label>
Password
</label>

<div class="password-row">

<input
    id="password"
    type="password"
    placeholder="Enter your password"
    autocomplete="current-password"
>

<button
    type="button"
    class="showPassword"
    onclick="togglePassword()"
>
Show
</button>

</div>


<button
    type="button"
    class="login-button"
    onclick="login()"
>
Login
</button>


<div
    id="message"
    class="message"
></div>


<div class="note">

Students use their registered Student ID
and student password.

</div>

</div>


<script>


/*
==================================================
DEFAULT STUDENT PASSWORD
==================================================
*/

const DEFAULT_STUDENT_PASSWORD = "000000";


/*
==================================================
LOGIN
==================================================
*/

function login() {


const loginType =
    document.getElementById(
        "loginType"
    ).value;


const username =
    document.getElementById(
        "username"
    ).value.trim();


const password =
    document.getElementById(
        "password"
    ).value;


const message =
    document.getElementById(
        "message"
    );


message.textContent = "";

message.className =
    "message";


/*
==================================================
VALIDATION
==================================================
*/

if (username === "") {

    message.className =
        "message error";

    message.textContent =
        "Please enter your ID or username.";

    return;

}


if (password === "") {

    message.className =
        "message error";

    message.textContent =
        "Please enter your password.";

    return;

}


/*
==================================================
ADMIN LOGIN
==================================================
*/

if (
    loginType === "admin"
) {


const adminUsername =
    localStorage.getItem(
        "adminUsername"
    ) || "admin";


const adminPassword =
    localStorage.getItem(
        "adminPassword"
    ) || "admin123";


if (
    username === adminUsername &&
    password === adminPassword
) {


localStorage.setItem(
    "loggedIn",
    "true"
);


localStorage.setItem(
    "userRole",
    "admin"
);


localStorage.setItem(
    "currentUser",
    "Administrator"
);


message.className =
    "message success";


message.textContent =
    "Administrator login successful.";


setTimeout(
    function() {

        window.location.href =
            "index.html";

    },
    500
);


return;

}


message.className =
    "message error";


message.textContent =
    "Invalid administrator username or password.";


return;

}


/*
==================================================
STUDENT LOGIN
==================================================
*/


const students =
    JSON.parse(
        localStorage.getItem(
            "students"
        ) || "[]"
    );


const student =
    students.find(
        function(item) {

            return String(
                item.studentId || ""
            ).trim()
            ===
            username;

        }
    );


if (!student) {

    message.className =
        "message error";

    message.textContent =
        "Student ID not found.";

    return;

}


/*
==================================================
STUDENT PASSWORD
==================================================
*/

const studentPassword =
    String(
        student.password ||
        DEFAULT_STUDENT_PASSWORD
    );


if (
    password !== studentPassword
) {

    message.className =
        "message error";

    message.textContent =
        "Incorrect password.";

    return;

}


/*
==================================================
SAVE STUDENT SESSION
==================================================
*/

localStorage.setItem(
    "loggedIn",
    "true"
);


localStorage.setItem(
    "userRole",
    "student"
);


localStorage.setItem(
    "currentStudentId",
    String(
        student.studentId
    )
);


localStorage.setItem(
    "currentStudentName",
    student.name ||
    student.fullName ||
    ""
);


message.className =
    "message success";


message.textContent =
    "Login successful. Opening student portal...";


/*
==================================================
IMPORTANT
STUDENT GOES TO INDEX.HTML
==================================================
*/

setTimeout(
    function() {

        window.location.href =
            "index.html";

    },
    500
);

}


/*
==================================================
SHOW / HIDE PASSWORD
==================================================
*/

function togglePassword() {


const password =
    document.getElementById(
        "password"
    );


const button =
    document.querySelector(
        ".showPassword"
    );


if (
    password.type === "password"
) {

    password.type =
        "text";

    button.textContent =
        "Hide";

}

else {

    password.type =
        "password";

    button.textContent =
        "Show";

}

}


/*
==================================================
ENTER KEY
==================================================
*/

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            login();

        }

    }
);

</script>


</body>

</html>
