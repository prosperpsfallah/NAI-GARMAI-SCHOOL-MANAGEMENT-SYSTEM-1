<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>NAI GARMAI | Grades</title>

<style>

* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    margin: 0;
    padding: 20px;
    color: #222;
}

.container {
    max-width: 1000px;
    margin: auto;
}

.header {
    background: #0b3d62;
    color: white;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
}

.header h1 {
    margin: 0 0 5px;
}

.header p {
    margin: 0 0 15px;
}

.panel {
    background: white;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
    box-shadow:
        0 4px 15px
        rgba(0,0,0,0.08);
}

label {
    display: block;
    font-weight: bold;
    margin-top: 12px;
}

select,
input {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border:
        1px solid #ddd;
    border-radius: 7px;
    font-size: 15px;
}

select:focus,
input:focus {
    outline: none;
    border-color: #0b3d62;
}

button {
    padding: 12px 18px;
    margin-top: 10px;
    border: none;
    border-radius: 7px;
    background: #0b3d62;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

.back {
    background: white;
    color: #0b3d62;
}

.approve {
    background: #198754;
    margin-right: 8px;
}

.reject {
    background: #d9534f;
}

.grade {
    background: #f5f7fa;
    padding: 18px;
    margin-top: 12px;
    border-radius: 9px;
    border-left: 4px solid #0b3d62;
}

.status {
    font-weight: bold;
}

.pending {
    color: #d97706;
}

.approved {
    color: #198754;
}

.rejected {
    color: #d9534f;
}

.locked {
    color: #555;
    font-size: 13px;
    margin-top: 8px;
}

.success {
    color: #198754;
    font-weight: bold;
    margin-top: 12px;
}

.error {
    color: #d9534f;
    font-weight: bold;
    margin-top: 12px;
}

.empty {
    color: #777;
}

.notice {
    background: #eef5fa;
    padding: 12px;
    border-radius: 8px;
    color: #555;
    margin-bottom: 15px;
}

</style>

</head>


<body>


<div class="container">


<!-- HEADER -->

<div class="header">

<h1>
NAI GARMAI SCHOOL SYSTEM
</h1>

<p>
Grades Management
</p>

<button
class="back"
onclick="goDashboard()"
>
← Dashboard
</button>

</div>


<!-- INSTRUCTOR SUBMISSION -->

<div
class="panel"
id="submissionPanel"
>

<h2>
Submit Grade
</h2>

<div class="notice">

Instructors can submit grades.
Submitted grades remain <strong>Pending</strong>
until the Administrator reviews them.

</div>


<label>
Student
</label>

<select id="studentSelect">

<option value="">
Select a registered student
</option>

</select>


<label>
Subject
</label>

<input
id="subject"
type="text"
placeholder="Example: Mathematics"
>


<label>
Score
</label>

<input
id="score"
type="number"
min="0"
max="100"
placeholder="Enter score from 0 to 100"
>


<button
onclick="submitGrade()"
>
Submit Grade
</button>


<div id="message"></div>

</div>


<!-- GRADE RECORDS -->

<div class="panel">

<h2>
Grade Records
</h2>

<div id="grades">

<p class="empty">
Loading grades...
</p>

</div>

</div>


</div>


<script>


/*
==================================================
SECURITY
==================================================
*/


const loggedIn =
localStorage.getItem(
"loggedIn"
);


const role =
localStorage.getItem(
"userRole"
);


if (
loggedIn !== "true"
) {

window.location.href =
"login.html";

}


/*
==================================================
LOAD DATA
==================================================
*/


let students =
JSON.parse(
localStorage.getItem(
"students"
)
) || [];


let grades =
JSON.parse(
localStorage.getItem(
"grades"
)
) || [];


/*
==================================================
SET PERMISSIONS
==================================================
*/


function setupRole() {


const panel =
document.getElementById(
"submissionPanel"
);


if (
role === "instructor"
) {

panel.style.display =
"block";

}

else {

panel.style.display =
"none";

}


/*
ADMIN CAN REVIEW.
STUDENT CANNOT MANAGE GRADES.
*/

}


/*
==================================================
LOAD STUDENTS
==================================================
*/


function loadStudents() {


const select =
document.getElementById(
"studentSelect"
);


select.innerHTML =

'<option value="">'
+
'Select a registered student'
+
'</option>';


if (
students.length === 0
) {

select.innerHTML +=

'<option value="">'
+
'No students registered'
+
'</option>';

return;

}


students.forEach(
function(student) {


const studentId =
student.studentId
||
student.id;


const studentName =
student.name
||
student.fullName
||
"Unknown Student";


const option =
document.createElement(
"option"
);


option.value =
studentId;


option.textContent =
studentName
+
" — "
+
studentId;


select.appendChild(
option
);

});

}


/*
==================================================
SUBMIT GRADE
==================================================
*/


function submitGrade() {


if (
role !== "instructor"
) {

alert(
"Only instructors can submit grades."
);

return;

}


const studentId =
document.getElementById(
"studentSelect"
).value;


const subject =
document.getElementById(
"subject"
)
.value
.trim();


const score =
document.getElementById(
"score"
).value;


const message =
document.getElementById(
"message"
);


message.textContent =
"";


/*
VALIDATION
*/


if (
studentId === ""
||
subject === ""
||
score === ""
) {

message.className =
"error";

message.textContent =
"Please complete all fields.";

return;

}


const numericScore =
Number(score);


if (
isNaN(numericScore)
||
numericScore < 0
||
numericScore > 100
) {

message.className =
"error";

message.textContent =
"Score must be between 0 and 100.";

return;

}


/*
FIND STUDENT
*/


const student =
students.find(
function(item) {

const id =
item.studentId
||
item.id;

return String(id)
===
String(studentId);

});

if (!student) {

message.className =
"error";

message.textContent =
"Student could not be found.";

return;

}


const studentName =
student.name
||
student.fullName
||
"Unknown Student";


/*
CREATE GRADE
*/


const newGrade = {

student:
studentName,

studentId:
String(studentId),

subject:
subject,

score:
numericScore,

status:
"Pending",

locked:
false,

submittedAt:
new Date()
.toISOString()

};


/*
SAVE GRADE
*/


grades.push(
newGrade
);


localStorage.setItem(

"grades",

JSON.stringify(
grades
)

);


/*
CLEAR FORM
*/


document.getElementById(
"studentSelect"
).value =
"";


document.getElementById(
"subject"
).value =
"";


document.getElementById(
"score"
).value =
"";


message.className =
"success";


message.textContent =
"Grade submitted successfully. Status: Pending";


displayGrades();

}


/*
==================================================
DISPLAY GRADES
==================================================
*/


function displayGrades() {


const container =
document.getElementById(
"grades"
);


container.innerHTML =
"";


/*
STUDENT VIEW
*/

if (
role === "student"
) {

const studentId =
localStorage.getItem(
"studentId"
);


const approvedGrades =
grades.filter(
function(grade) {

return (

String(
grade.studentId
)
===
String(
studentId
)

&&

String(
grade.status
||
""
)
.toLowerCase()
===
"approved"

);

});


if (
approvedGrades.length === 0
) {

container.innerHTML =

"<p class='empty'>"
+
"No approved grades available yet."
+
"</p>";

return;

}


approvedGrades.forEach(
function(grade) {

createGradeCard(
grade,
container,
false
);

});

return;

}


/*
ADMIN / INSTRUCTOR VIEW
*/


if (
grades.length === 0
) {

container.innerHTML =

"<p class='empty'>"
+
"No grades submitted yet."
+
"</p>";

return;

}


grades.forEach(
function(grade, index) {

createGradeCard(
grade,
container,
true,
index
);

});

}


/*
==================================================
CREATE GRADE CARD
==================================================
*/


function createGradeCard(
grade,
container,
showManagement,
index
) {


const div =
document.createElement(
"div"
);


div.className =
"grade";


let statusClass =
"pending";


if (
String(
grade.status
)
.toLowerCase()
===
"approved"
) {

statusClass =
"approved";

}


if (
String(
grade.status
)
.toLowerCase()
===
"rejected"
) {

statusClass =
"rejected";

}


div.innerHTML =

"<strong>Student:</strong> "
+
escapeHTML(
grade.student
||
"Unknown"
)

+

"<br>"

+

"<strong>Student ID:</strong> "
+
escapeHTML(
grade.studentId
||
"Unknown"
)

+

"<br>"

+

"<strong>Subject:</strong> "
+
escapeHTML(
grade.subject
||
"Unknown"
)

+

"<br>"

+

"<strong>Score:</strong> "
+
escapeHTML(
grade.score
||
"0"
)

+

"<br>"

+

"<strong>Status:</strong> "

+

"<span class='status "
+
statusClass
+
"'>"

+
escapeHTML(
grade.status
||
"Pending"
)

+
"</span>";


/*
ADMIN CONTROLS
*/


if (
role === "admin"
&&
grade.status === "Pending"
&&
grade.locked !== true
) {


const approveButton =
document.createElement(
"button"
);


approveButton.className =
"approve";


approveButton.textContent =
"Approve";


approveButton.onclick =
function() {

approveGrade(
index
);

};


const rejectButton =
document.createElement(
"button"
);


rejectButton.className =
"reject";


rejectButton.textContent =
"Reject";


rejectButton.onclick =
function() {

rejectGrade(
index
);

};


div.appendChild(
document.createElement(
"br"
)
);


div.appendChild(
approveButton
);


div.appendChild(
rejectButton
);

}


/*
LOCKED MESSAGE
*/


if (
grade.locked === true
) {

const lockedText =
document.createElement(
"div"
);


lockedText.className =
"locked";


lockedText.textContent =
"🔒 This grade is locked and cannot be changed.";


div.appendChild(
lockedText
);

}


container.appendChild(
div
);

}


/*
==================================================
APPROVE GRADE
==================================================
*/


function approveGrade(
index
) {


if (
role !== "admin"
) {

alert(
"Only the Administrator can approve grades."
);

return;

}


if (
!grades[index]
) {

return;

}


if (
grades[index].locked === true
) {

alert(
"This grade is already locked."
);

return;

}


grades[index].status =
"Approved";


grades[index].locked =
true;


grades[index].approvedAt =
new Date()
.toISOString();


localStorage.setItem(

"grades",

JSON.stringify(
grades
)

);


displayGrades();

}


/*
==================================================
REJECT GRADE
==================================================
*/


function rejectGrade(
index
) {


if (
role !== "admin"
) {

alert(
"Only the Administrator can reject grades."
);

return;

}


if (
!grades[index]
) {

return;

}


if (
grades[index].locked === true
) {

alert(
"This grade is already locked."
);

return;

}


grades[index].status =
"Rejected";


grades[index].locked =
true;


grades[index].rejectedAt =
new Date()
.toISOString();


localStorage.setItem(

"grades",

JSON.stringify(
grades
)

);


displayGrades();

}


/*
==================================================
DASHBOARD
==================================================
*/


function goDashboard() {

window.location.href =
"index.html";

}


/*
==================================================
HTML SECURITY
==================================================
*/


function escapeHTML(
value
) {

return String(
value ??
""
)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}


/*
==================================================
START
==================================================
*/


setupRole();

loadStudents();

displayGrades();


</script>


</body>

</html>
