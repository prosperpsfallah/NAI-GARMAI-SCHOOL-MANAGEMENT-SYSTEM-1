<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAI GARMAI | Grades</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        .header,
        .panel {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .header {
            background: #0b3d62;
            color: white;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            padding: 12px 18px;
            margin: 8px 5px 0 0;
            border: none;
            border-radius: 7px;
            background: #0b3d62;
            color: white;
            cursor: pointer;
        }

        .grade {
            background: #f1f1f1;
            padding: 15px;
            margin-top: 12px;
            border-radius: 8px;
        }

        .approve {
            background: #198754;
        }

        .reject {
            background: #d9534f;
        }

        .status {
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>NAI GARMAI</h1>
        <p>Grades Management</p>

        <button onclick="goDashboard()">
            ← Dashboard
        </button>
    </div>


    <div class="panel">

        <h2>Submit Grade</h2>

        <input
            id="student"
            type="text"
            placeholder="Student Name"
        >

        <input
            id="studentId"
            type="text"
            placeholder="Student ID"
        >

        <input
            id="subject"
            type="text"
            placeholder="Subject"
        >

        <input
            id="score"
            type="number"
            min="0"
            max="100"
            placeholder="Score (0-100)"
        >

        <button onclick="submitGrade()">
            Submit Grade
        </button>

    </div>


    <div class="panel">

        <h2>Grade Records</h2>

        <div id="grades"></div>

    </div>

</div>


<script>

let grades =
    JSON.parse(
        localStorage.getItem("grades")
    ) || [];


const role =
    localStorage.getItem("userRole");


function submitGrade() {

    if (role !== "instructor") {

        alert(
            "Only instructors can submit grades."
        );

        return;
    }


    const student =
        document.getElementById("student")
        .value.trim();

    const studentId =
        document.getElementById("studentId")
        .value.trim();

    const subject =
        document.getElementById("subject")
        .value.trim();

    const score =
        document.getElementById("score")
        .value;


    if (
        student === "" ||
        studentId === "" ||
        subject === "" ||
        score === ""
    ) {

        alert(
            "Please complete all fields."
        );

        return;
    }


    grades.push({

    student: student,
    studentId: studentId,
    subject: subject,
    score: score,
    status: "Pending",
    locked: false

});
    });


    localStorage.setItem(
        "grades",
        JSON.stringify(grades)
    );


    document.getElementById("student").value = "";
    document.getElementById("studentId").value = "";
    document.getElementById("subject").value = "";
    document.getElementById("score").value = "";


    displayGrades();

}
function submitGrade() {

    if (role !== "instructor") {
        alert("Only instructors can submit grades.");
        return;
    }

    const student =
        document.getElementById("student").value.trim();

    const studentId =
        document.getElementById("studentId").value.trim();

    const subject =
        document.getElementById("subject").value.trim();

    const score =
        document.getElementById("score").value;

    const message =
        document.getElementById("message");


    if (
        student === "" ||
        studentId === "" ||
        subject === "" ||
        score === ""
    ) {
        message.style.color = "red";
        message.textContent =
            "Please complete all fields.";
        return;
    }


    if (Number(score) < 0 || Number(score) > 100) {
        message.style.color = "red";
        message.textContent =
            "Score must be between 0 and 100.";
        return;
    }


    grades.push({

        student: student,
        studentId: studentId,
        subject: subject,
        score: score,

        status: "Pending",

        locked: false

    });


    localStorage.setItem(
        "grades",
        JSON.stringify(grades)
    );


    document.getElementById("student").value = "";
    document.getElementById("studentId").value = "";
    document.getElementById("subject").value = "";
    document.getElementById("score").value = "";


    message.style.color = "green";

    message.textContent =
        "Grade submitted successfully — Status: Pending";


    displayGrades();

}

function rejectGrade(index) {

    if (role !== "admin") {
        return;
    }


    grades[index].status =
        "Rejected";


    localStorage.setItem(
        "grades",
        JSON.stringify(grades)
    );


    displayGrades();

}


function goDashboard() {

    window.location.href =
        "index.html";

}


displayGrades();

</script>

</body>
</html>
