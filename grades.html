<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NAI GARMAI | Grades</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        .header {
            background: #0b3d62;
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 0 0 5px;
        }

        .panel {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            padding: 12px 18px;
            margin-top: 10px;
            border: none;
            border-radius: 7px;
            background: #0b3d62;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .back {
            background: white;
            color: #0b3d62;
        }

        .grade {
            background: #f1f1f1;
            padding: 15px;
            margin-top: 12px;
            border-radius: 8px;
        }

        .approve {
            background: #198754;
            margin-right: 8px;
        }

        .reject {
            background: #d9534f;
        }

        .status {
            font-weight: bold;
        }

        .pending {
            color: #d97706;
        }

        .approved {
            color: #198754;
        }

        .rejected {
            color: #d9534f;
        }

        .success-message {
            color: #198754;
            font-weight: bold;
            margin-top: 12px;
        }

        .error-message {
            color: #d9534f;
            font-weight: bold;
            margin-top: 12px;
        }

    </style>

</head>


<body>


<div class="container">


    <div class="header">

        <h1>NAI GARMAI</h1>

        <p>Grades Management</p>

        <button
            class="back"
            onclick="goDashboard()"
        >
            ← Dashboard
        </button>

    </div>


    <!-- INSTRUCTOR GRADE SUBMISSION -->

    <div
        class="panel"
        id="submissionPanel"
    >

        <h2>Submit Grade</h2>

        <input
            id="student"
            type="text"
            placeholder="Student Name"
        >

        <input
            id="studentId"
            type="text"
            placeholder="Student ID"
        >

        <input
            id="subject"
            type="text"
            placeholder="Subject"
        >

        <input
            id="score"
            type="number"
            min="0"
            max="100"
            placeholder="Score (0-100)"
        >

        <button onclick="submitGrade()">
            Submit Grade
        </button>

        <div id="message"></div>

    </div>


    <!-- GRADE RECORDS -->

    <div class="panel">

        <h2>Grade Records</h2>

        <div id="grades"></div>

    </div>


</div>


<script>


/* CURRENT USER ROLE */

const role =
    localStorage.getItem("userRole");


/* SAVED GRADES */

let grades =
    JSON.parse(
        localStorage.getItem("grades")
    ) || [];


/* SHOW SUBMISSION FORM ONLY TO INSTRUCTOR */

function setupRole() {

    const submissionPanel =
        document.getElementById(
            "submissionPanel"
        );

    if (role === "instructor") {

        submissionPanel.style.display =
            "block";

    } else {

        submissionPanel.style.display =
            "none";

    }

}


/* SUBMIT GRADE */

function submitGrade() {

    if (role !== "instructor") {

        alert(
            "Only instructors can submit grades."
        );

        return;
    }


    const student =
        document.getElementById(
            "student"
        ).value.trim();


    const studentId =
        document.getElementById(
            "studentId"
        ).value.trim();


    const subject =
        document.getElementById(
            "subject"
        ).value.trim();


    const score =
        document.getElementById(
            "score"
        ).value;


    const message =
        document.getElementById(
            "message"
        );


    /* CHECK REQUIRED FIELDS */

    if (
        student === "" ||
        studentId === "" ||
        subject === "" ||
        score === ""
    ) {

        message.className =
            "error-message";

        message.textContent =
            "Please complete all fields.";

        return;
    }


    /* CHECK SCORE */

    if (
        Number(score) < 0 ||
        Number(score) > 100
    ) {

        message.className =
            "error-message";

        message.textContent =
            "Score must be between 0 and 100.";

        return;
    }


    /* CREATE NEW PENDING GRADE */

    const newGrade = {

        student: student,

        studentId: studentId,

        subject: subject,

        score: Number(score),

        status: "Pending",

        locked: false

    };


    /* ADD GRADE */

    grades.push(
        newGrade
    );


    /* SAVE GRADE */

    localStorage.setItem(
        "grades",
        JSON.stringify(grades)
    );


    /* CLEAR FORM */

    document.getElementById(
        "student"
    ).value = "";


    document.getElementById(
        "studentId"
    ).value = "";


    document.getElementById(
        "subject"
    ).value = "";


    document.getElementById(
        "score"
    ).value = "";


    /* SHOW SUCCESS MESSAGE */

    message.className =
        "success-message";


    message.textContent =
        "Grade submitted successfully — Status: Pending";


    /* REFRESH RECORDS */

    displayGrades();

}


/* DISPLAY GRADES */

function displayGrades() {

    const container =
        document.getElementById(
            "grades"
        );


    container.innerHTML = "";


    if (grades.length === 0) {

        container.innerHTML =
            "<p>No grades submitted yet.</p>";

        return;
    }


    grades.forEach(
        function(grade, index) {


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "grade";


            let statusClass =
                "pending";


            if (
                grade.status === "Approved"
            ) {

                statusClass =
                    "approved";

            }


            if (
                grade.status === "Rejected"
            ) {

                statusClass =
                    "rejected";

            }


            div.innerHTML =

                "<strong>Student:</strong> "
                + grade.student

                + "<br><strong>ID:</strong> "
                + grade.studentId

                + "<br><strong>Subject:</strong> "
                + grade.subject

                + "<br><strong>Score:</strong> "
                + grade.score

                + "<br><strong>Status:</strong> "

                + "<span class='status "
                + statusClass
                + "'>"

                + grade.status

                + "</span>";


            /* ADMIN APPROVAL BUTTONS */

            if (
                role === "admin" &&
                grade.status === "Pending" &&
                grade.locked !== true
            ) {


                div.innerHTML +=

                    "<br>"

                    + "<button "
                    + "class='approve' "
                    + "onclick='approveGrade("
                    + index
                    + ")'>"
                    + "Approve"
                    + "</button>"


                    + "<button "
                    + "class='reject' "
                    + "onclick='rejectGrade("
                    + index
                    + ")'>"
                    + "Reject"
                    + "</button>";

            }


            container.appendChild(
                div
            );

        }
    );

}


/* ADMIN APPROVES GRADE */

function approveGrade(index) {

    if (role !== "admin") {

        return;
    }


    grades[index].status =
        "Approved";


    grades[index].locked =
        true;


    localStorage.setItem(
        "grades",
        JSON.stringify(grades)
    );


    displayGrades();

}


/* ADMIN REJECTS GRADE */

function rejectGrade(index) {

    if (role !== "admin") {

        return;
    }


    grades[index].status =
        "Rejected";


    grades[index].locked =
        true;


    localStorage.setItem(
        "grades",
        JSON.stringify(grades)
    );


    displayGrades();

}


/* DASHBOARD */

function goDashboard() {

    window.location.href =
        "index.html";

}


/* START PAGE */

setupRole();

displayGrades();


</script>


</body>

</html>
