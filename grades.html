<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NAI GARMAI | Grades</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        .header {
            background: #0b3d62;
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 0 0 5px;
        }

        .panel {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        select,
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            padding: 12px 18px;
            margin-top: 10px;
            border: none;
            border-radius: 7px;
            background: #0b3d62;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .back {
            background: white;
            color: #0b3d62;
        }

        .grade {
            background: #f1f1f1;
            padding: 15px;
            margin-top: 12px;
            border-radius: 8px;
        }

        .approve {
            background: #198754;
            margin-right: 8px;
        }

        .reject {
            background: #d9534f;
        }

        .status {
            font-weight: bold;
        }

        .pending {
            color: #d97706;
        }

        .approved {
            color: #198754;
        }

        .rejected {
            color: #d9534f;
        }

        .success {
            color: #198754;
            font-weight: bold;
            margin-top: 12px;
        }

        .error {
            color: #d9534f;
            font-weight: bold;
            margin-top: 12px;
        }

    </style>

</head>


<body>


<div class="container">


    <div class="header">

        <h1>NAI GARMAI</h1>

        <p>Grades Management</p>

        <button
            class="back"
            onclick="goDashboard()"
        >
            ← Dashboard
        </button>

    </div>


    <!-- INSTRUCTOR FORM -->

    <div
        class="panel"
        id="submissionPanel"
    >

        <h2>Submit Grade</h2>


        <label>
            Select Student
        </label>


        <select id="studentSelect">

            <option value="">
                Select a registered student
            </option>

        </select>


        <input
            id="subject"
            type="text"
            placeholder="Subject"
        >


        <input
            id="score"
            type="number"
            min="0"
            max="100"
            placeholder="Score (0-100)"
        >


        <button onclick="submitGrade()">
            Submit Grade
        </button>


        <div id="message"></div>

    </div>


    <!-- RECORDS -->

    <div class="panel">

        <h2>Grade Records</h2>

        <div id="grades"></div>

    </div>


</div>


<script>


/* USER ROLE */

const role =
    localStorage.getItem(
        "userRole"
    );


/* LOAD REGISTERED STUDENTS */

let students =
    JSON.parse(
        localStorage.getItem(
            "students"
        )
    ) || [];


/* LOAD GRADES */

let grades =
    JSON.parse(
        localStorage.getItem(
            "grades"
        )
    ) || [];


/* SET ROLE */

function setupRole() {

    const panel =
        document.getElementById(
            "submissionPanel"
        );


    if (role === "instructor") {

        panel.style.display =
            "block";

    } else {

        panel.style.display =
            "none";

    }

}


/* LOAD STUDENTS INTO DROPDOWN */

function loadStudents() {

    const select =
        document.getElementById(
            "studentSelect"
        );


    select.innerHTML =
        '<option value="">Select a registered student</option>';


    if (students.length === 0) {

        select.innerHTML +=
            '<option value="">No students registered</option>';

        return;

    }


    students.forEach(
        function(student) {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                student.id;


            option.textContent =
                student.name
                + " — "
                + student.id;


            select.appendChild(
                option
            );

        }
    );

}


/* SUBMIT GRADE */

function submitGrade() {

    if (role !== "instructor") {

        alert(
            "Only instructors can submit grades."
        );

        return;

    }


    const studentId =
        document.getElementById(
            "studentSelect"
        ).value;


    const subject =
        document.getElementById(
            "subject"
        ).value.trim();


    const score =
        document.getElementById(
            "score"
        ).value;


    const message =
        document.getElementById(
            "message"
        );


    if (
        studentId === "" ||
        subject === "" ||
        score === ""
    ) {

        message.className =
            "error";

        message.textContent =
            "Please select a student and complete all fields.";

        return;

    }


    if (
        Number(score) < 0 ||
        Number(score) > 100
    ) {

        message.className =
            "error";

        message.textContent =
            "Score must be between 0 and 100.";

        return;

    }


    const student =
        students.find(
            function(item) {

                return item.id === studentId;

            }
        );


    if (!student) {

        message.className =
            "error";

        message.textContent =
            "Student could not be found.";

        return;

    }


    grades.push({

        student: student.name,

        studentId: student.id,

        subject: subject,

        score: Number(score),

        status: "Pending",

        locked: false

    });


    localStorage.setItem(

        "grades",

        JSON.stringify(
            grades
        )

    );


    document.getElementById(
        "studentSelect"
    ).value = "";


    document.getElementById(
        "subject"
    ).value = "";


    document.getElementById(
        "score"
    ).value = "";


    message.className =
        "success";


    message.textContent =
        "Grade submitted successfully — Status: Pending";


    displayGrades();

}


/* DISPLAY GRADES */

function displayGrades() {

    const container =
        document.getElementById(
            "grades"
        );


    container.innerHTML = "";


    if (grades.length === 0) {

        container.innerHTML =
            "<p>No grades submitted yet.</p>";

        return;

    }


    grades.forEach(
        function(grade, index) {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "grade";


            let statusClass =
                "pending";


            if (
                grade.status === "Approved"
            ) {

                statusClass =
                    "approved";

            }


            if (
                grade.status === "Rejected"
            ) {

                statusClass =
                    "rejected";

            }


            div.innerHTML =

                "<strong>Student:</strong> "
                + grade.student

                + "<br><strong>ID:</strong> "
                + grade.studentId

                + "<br><strong>Subject:</strong> "
                + grade.subject

                + "<br><strong>Score:</strong> "
                + grade.score

                + "<br><strong>Status:</strong> "

                + "<span class='status "
                + statusClass
                + "'>"

                + grade.status

                + "</span>";


            if (
                role === "admin" &&
                grade.status === "Pending" &&
                grade.locked !== true
            ) {

                div.innerHTML +=

                    "<br>"

                    + "<button "
                    + "class='approve' "
                    + "onclick='approveGrade("
                    + index
                    + ")'>"
                    + "Approve"
                    + "</button>"

                    + "<button "
                    + "class='reject' "
                    + "onclick='rejectGrade("
                    + index
                    + ")'>"
                    + "Reject"
                    + "</button>";

            }


            container.appendChild(
                div
            );

        }
    );

}


/* APPROVE */

function approveGrade(index) {

    if (role !== "admin") {
        return;
    }


    grades[index].status =
        "Approved";


    grades[index].locked =
        true;


    localStorage.setItem(

        "grades",

        JSON.stringify(
            grades
        )

    );


    displayGrades();

}


/* REJECT */

function rejectGrade(index) {

    if (role !== "admin") {
        return;
    }


    grades[index].status =
        "Rejected";


    grades[index].locked =
        true;


    localStorage.setItem(

        "grades",

        JSON.stringify(
            grades
        )

    );


    displayGrades();

}


/* DASHBOARD */

function goDashboard() {

    window.location.href =
        "index.html";

}


/* START */

setupRole();

loadStudents();

displayGrades();


</script>


</body>

</html>
