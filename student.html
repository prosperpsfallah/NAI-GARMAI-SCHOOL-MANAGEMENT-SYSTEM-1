<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NAI GARMAI | Students</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #222;
    padding: 20px;
}

.container {
    max-width: 1100px;
    margin: auto;
}

.header {
    background: #0b3d62;
    color: white;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
}

.header h1 {
    margin: 0 0 5px;
}

.panel {
    background: white;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

label {
    display: block;
    font-weight: bold;
    margin-top: 12px;
}

input {
    width: 100%;
    padding: 13px;
    margin: 8px 0 15px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 15px;
}

input:focus {
    outline: none;
    border-color: #0b3d62;
}

button {
    padding: 12px 18px;
    border: none;
    border-radius: 8px;
    background: #0b3d62;
    color: white;
    cursor: pointer;
    font-weight: bold;
    margin-top: 5px;
}

.back {
    background: white;
    color: #0b3d62;
}

.edit {
    background: #0b3d62;
    margin-right: 8px;
}

.delete {
    background: #d9534f;
}

.cancel {
    background: #777;
    margin-left: 8px;
}

.student {
    background: #f5f7fa;
    padding: 18px;
    margin-top: 12px;
    border-radius: 10px;
    border-left: 4px solid #0b3d62;
}

.credential {
    background: white;
    padding: 12px;
    border-radius: 8px;
    margin-top: 12px;
    border: 1px solid #ddd;
}

.credential strong {
    color: #0b3d62;
}

.success {
    color: #198754;
    font-weight: bold;
    margin-top: 12px;
}

.error {
    color: #d9534f;
    font-weight: bold;
    margin-top: 12px;
}

.note {
    background: #eef5fa;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 15px;
    color: #555;
    font-size: 14px;
}

.empty {
    color: #777;
}

.admin-only {
    display: none;
}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>NAI GARMAI SCHOOL SYSTEM</h1>

<p>Student Management</p>

<button
class="back"
onclick="goDashboard()"
>
← Dashboard
</button>

</div>


<!-- ADMIN STUDENT FORM -->

<div
class="panel admin-only"
id="studentForm"
>

<h2 id="formTitle">
Register New Student
</h2>

<div class="note">

Administrator has full control over student records.
You can register, edit, and delete students.

</div>


<label>
Student Full Name
</label>

<input
id="studentName"
type="text"
placeholder="Enter student's full name"
>


<label>
Class / Grade
</label>

<input
id="studentClass"
type="text"
placeholder="Example: Grade 8"
>


<label>
Parent / Guardian Phone
</label>

<input
id="studentPhone"
type="text"
placeholder="Enter parent or guardian phone"
>


<button
id="saveButton"
onclick="saveStudent()"
>
Register Student
</button>

<button
id="cancelButton"
class="cancel"
onclick="cancelEdit()"
style="display:none;"
>
Cancel Edit
</button>


<div id="message"></div>

</div>


<!-- STUDENT RECORDS -->

<div class="panel">

<h2>
Student Records
</h2>

<div id="students">

<p class="empty">
Loading students...
</p>

</div>

</div>

</div>


<script>

/*
==================================================
LOGIN SECURITY
==================================================
*/

const loggedIn =
localStorage.getItem("loggedIn");

const role =
localStorage.getItem("userRole");


if (loggedIn !== "true") {

    window.location.href = "login.html";

}


/*
==================================================
ADMIN ONLY
==================================================
*/

if (role === "admin") {

    document.getElementById(
        "studentForm"
    ).style.display = "block";

}


/*
==================================================
LOAD STUDENTS
==================================================
*/

let students =
JSON.parse(
    localStorage.getItem("students")
) || [];


let editingIndex = -1;


/*
==================================================
GENERATE STUDENT ID
==================================================
*/

function generateStudentId() {

    let highestNumber = 0;

    students.forEach(function(student) {

        const existingId =
            String(
                student.studentId ||
                student.id ||
                ""
            );

        const match =
            existingId.match(/NG-(\d+)/);

        if (match) {

            const number =
                parseInt(match[1], 10);

            if (number > highestNumber) {

                highestNumber = number;

            }

        }

    });

    return (
        "NG-" +
        String(
            highestNumber + 1
        ).padStart(4, "0")
    );

}


/*
==================================================
GENERATE USERNAME
==================================================
*/

function generateUsername(name) {

    const cleanName =
        name
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9\s]/g, "")
        .replace(/\s+/g, ".");

    let username = cleanName;

    let number = 1;

    while (
        students.some(function(student, index) {

            if (index === editingIndex) {

                return false;

            }

            return (
                String(
                    student.username || ""
                ).toLowerCase()
                ===
                username.toLowerCase()
            );

        })
    ) {

        number++;

        username =
            cleanName + number;

    }

    return username;

}


/*
==================================================
GENERATE PASSWORD
==================================================
*/

function generatePassword() {

    const characters =
        "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789";

    let password = "";

    for (
        let i = 0;
        i < 8;
        i++
    ) {

        const randomIndex =
            Math.floor(
                Math.random() *
                characters.length
            );

        password +=
            characters[randomIndex];

    }

    return password;

}


/*
==================================================
SAVE STUDENT
==================================================
*/

function saveStudent() {

    if (role !== "admin") {

        alert(
            "Only the Administrator can manage students."
        );

        return;

    }


    const name =
        document.getElementById(
            "studentName"
        ).value.trim();


    const studentClass =
        document.getElementById(
            "studentClass"
        ).value.trim();


    const phone =
        document.getElementById(
            "studentPhone"
        ).value.trim();


    const message =
        document.getElementById(
            "message"
        );


    message.textContent = "";


    if (
        name === "" ||
        studentClass === ""
    ) {

        message.className = "error";

        message.textContent =
            "Please enter the student's name and class.";

        return;

    }


    /*
    ==============================================
    EDIT EXISTING STUDENT
    ==============================================
    */

    if (editingIndex !== -1) {

        const student =
            students[editingIndex];

        student.name = name;

        student.fullName = name;

        student.studentClass =
            studentClass;

        student.class =
            studentClass;

        student.phone =
            phone;

        student.updatedAt =
            new Date().toISOString();


        localStorage.setItem(
            "students",
            JSON.stringify(students)
        );


        message.className =
            "success";

        message.textContent =
            "Student information updated successfully.";

        cancelEdit();

        displayStudents();

        return;

    }


    /*
    ==============================================
    REGISTER NEW STUDENT
    ==============================================
    */

    const studentId =
        generateStudentId();


    const username =
        generateUsername(name);


    const password =
        generatePassword();


    const newStudent = {

        id: studentId,

        studentId: studentId,

        name: name,

        fullName: name,

        studentClass: studentClass,

        class: studentClass,

        phone: phone,

        username: username,

        password: password,

        accountStatus: "Active",

        createdAt:
            new Date().toISOString()

    };


    students.push(newStudent);


    localStorage.setItem(
        "students",
        JSON.stringify(students)
    );


    document.getElementById(
        "studentName"
    ).value = "";

    document.getElementById(
        "studentClass"
    ).value = "";

    document.getElementById(
        "studentPhone"
    ).value = "";


    message.className =
        "success";

    message.textContent =
        "Student registered successfully.";


    displayStudents();

}


/*
==================================================
EDIT STUDENT
==================================================
*/

function editStudent(index) {

    if (role !== "admin") {

        alert(
            "Only the Administrator can edit students."
        );

        return;

    }


    const student =
        students[index];

    if (!student) {

        return;

    }


    editingIndex = index;


    document.getElementById(
        "formTitle"
    ).textContent =
        "Edit Student";


    document.getElementById(
        "studentName"
    ).value =
        student.name ||
        student.fullName ||
        "";


    document.getElementById(
        "studentClass"
    ).value =
        student.studentClass ||
        student.class ||
        "";


    document.getElementById(
        "studentPhone"
    ).value =
        student.phone ||
        "";


    document.getElementById(
        "saveButton"
    ).textContent =
        "Save Changes";


    document.getElementById(
        "cancelButton"
    ).style.display =
        "inline-block";


    document.getElementById(
        "studentForm"
    ).scrollIntoView({
        behavior: "smooth"
    });

}


/*
==================================================
CANCEL EDIT
==================================================
*/

function cancelEdit() {

    editingIndex = -1;


    document.getElementById(
        "formTitle"
    ).textContent =
        "Register New Student";


    document.getElementById(
        "saveButton"
    ).textContent =
        "Register Student";


    document.getElementById(
        "cancelButton"
    ).style.display =
        "none";


    document.getElementById(
        "studentName"
    ).value = "";

    document.getElementById(
        "studentClass"
    ).value = "";

    document.getElementById(
        "studentPhone"
    ).value = "";

}


/*
==================================================
DISPLAY STUDENTS
==================================================
*/

function displayStudents() {

    const container =
        document.getElementById(
            "students"
        );


    container.innerHTML = "";


    if (students.length === 0) {

        container.innerHTML =
            "<p class='empty'>" +
            "No students registered yet." +
            "</p>";

        return;

    }


    students.forEach(
        function(student, index) {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "student";


            const name =
                student.name ||
                student.fullName ||
                "Not provided";


            const id =
                student.studentId ||
                student.id ||
                "Not provided";


            const studentClass =
                student.studentClass ||
                student.class ||
                "Not provided";


            const phone =
                student.phone ||
                "Not provided";


            const username =
                student.username ||
                "Not created";


            const password =
                student.password ||
                "Not created";


            div.innerHTML =

                "<strong>Name:</strong> " +
                escapeHTML(name) +

                "<br><br>" +

                "<strong>Student ID:</strong> " +
                escapeHTML(id) +

                "<br><br>" +

                "<strong>Class / Grade:</strong> " +
                escapeHTML(studentClass) +

                "<br><br>" +

                "<strong>Parent / Guardian Phone:</strong> " +
                escapeHTML(phone) +

                "<div class='credential'>" +

                "<strong>Student Login</strong>" +

                "<br><br>" +

                "<strong>Username:</strong> " +
                escapeHTML(username) +

                "<br>" +

                "<strong>Temporary Password:</strong> " +
                escapeHTML(password) +

                "<br>" +

                "<strong>Account Status:</strong> " +
                escapeHTML(
                    student.accountStatus ||
                    "Active"
                ) +

                "</div>";


            /*
            ==========================================
            ADMIN CONTROLS
            ==========================================
            */

            if (role === "admin") {

                const editButton =
                    document.createElement(
                        "button"
                    );

                editButton.className =
                    "edit";

                editButton.textContent =
                    "Edit Student";

                editButton.onclick =
                    function() {

                        editStudent(index);

                    };


                const deleteButton =
                    document.createElement(
                        "button"
                    );

                deleteButton.className =
                    "delete";

                deleteButton.textContent =
                    "Delete Student";

                deleteButton.onclick =
                    function() {

                        deleteStudent(index);

                    };


                div.appendChild(
                    document.createElement("br")
                );

                div.appendChild(
                    editButton
                );

                div.appendChild(
                    deleteButton
                );

            }


            container.appendChild(div);

        }
    );

}


/*
==================================================
DELETE STUDENT
==================================================
*/

function deleteStudent(index) {

    if (role !== "admin") {

        alert(
            "Only the Administrator can delete students."
        );

        return;

    }


    const student =
        students[index];


    if (!student) {

        return;

    }


    const confirmed =
        confirm(
            "Delete " +
            (
                student.name ||
                student.fullName ||
                "this student"
            ) +
            "? This action cannot be undone."
        );


    if (!confirmed) {

        return;

    }


    students.splice(
        index,
        1
    );


    localStorage.setItem(
        "students",
        JSON.stringify(students)
    );


    displayStudents();

}


/*
==================================================
DASHBOARD
==================================================
*/

function goDashboard() {

    window.location.href =
        "index.html";

}


/*
==================================================
HTML SECURITY
==================================================
*/

function escapeHTML(value) {

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/*
==================================================
START
==================================================
*/

displayStudents();

</script>

</body>
</html>
