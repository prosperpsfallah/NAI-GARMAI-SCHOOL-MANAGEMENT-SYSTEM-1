<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>NAI GARMAI | Login</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #222;
}

.loginBox {
    width: 100%;
    max-width: 430px;
    background: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.12);
}

.logo {
    text-align: center;
    margin-bottom: 25px;
}

.logo h1 {
    margin: 0;
    color: #0b3d62;
    font-size: 27px;
}

.logo p {
    margin-top: 8px;
    color: #666;
}

h2 {
    color: #0b3d62;
    margin-bottom: 20px;
}

label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
}

input,
select {
    width: 100%;
    padding: 13px;
    margin-top: 7px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
}

input:focus,
select:focus {
    outline: none;
    border-color: #0b3d62;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 20px;
    border: none;
    border-radius: 8px;
    background: #0b3d62;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

.message {
    margin-top: 15px;
    text-align: center;
    font-weight: bold;
}

.error {
    color: #d9534f;
}

.success {
    color: #198754;
}

.info {
    background: #eaf7ee;
    color: #245c35;
    padding: 12px;
    border-radius: 8px;
    margin-top: 15px;
    font-size: 14px;
}

.passwordWrap {
    position: relative;
}

.passwordWrap input {
    padding-right: 70px;
}

.showPassword {
    position: absolute;
    right: 8px;
    top: 7px;
    width: auto;
    margin: 0;
    padding: 9px 10px;
    background: transparent;
    color: #0b3d62;
    font-size: 13px;
}

.divider {
    text-align: center;
    margin: 25px 0;
    color: #999;
}

@media (max-width: 500px) {

    .loginBox {
        padding: 22px;
    }

}

</style>

</head>

<body>

<div class="loginBox">

    <div class="logo">

        <h1>
            NAI GARMAI
        </h1>

        <p>
            SCHOOL MANAGEMENT SYSTEM
        </p>

    </div>


    <h2>
        Portal Login
    </h2>


    <label>
        Login As
    </label>

    <select id="loginType">

        <option value="student">
            Student
        </option>

        <option value="admin">
            Administrator
        </option>

    </select>


    <label>
        Student ID / Administrator Username
    </label>

    <input
        id="username"
        type="text"
        placeholder="Enter your ID or username"
        autocomplete="username"
    >


    <label>
        Password
    </label>

    <div class="passwordWrap">

        <input
            id="password"
            type="password"
            placeholder="Enter your password"
            autocomplete="current-password"
        >

        <button
            type="button"
            class="showPassword"
            onclick="togglePassword()"
        >
            Show
        </button>

    </div>


    <button
        onclick="login()"
    >
        Login
    </button>


    <div
        id="message"
        class="message"
    ></div>


    <div class="info">

        <strong>Students:</strong><br>

        Use the Student ID given to you by the
        school administrator.

        <br><br>

        New students receive the default password:

        <strong>000000</strong>

        <br><br>

        You can change your password after logging
        into your student portal.

    </div>


</div>


<script>

/*
==================================================
DEFAULT STUDENT PASSWORD
==================================================
*/

const DEFAULT_STUDENT_PASSWORD = "000000";


/*
==================================================
LOGIN
==================================================
*/

function login() {

    const loginType =
        document.getElementById(
            "loginType"
        ).value;

    const username =
        document.getElementById(
            "username"
        ).value.trim();

    const password =
        document.getElementById(
            "password"
        ).value;

    const message =
        document.getElementById(
            "message"
        );


    message.textContent = "";

    message.className =
        "message";


    /*
    ==============================================
    VALIDATION
    ==============================================
    */

    if (username === "") {

        message.className =
            "message error";

        message.textContent =
            "Please enter your ID or username.";

        return;

    }


    if (password === "") {

        message.className =
            "message error";

        message.textContent =
            "Please enter your password.";

        return;

    }


    /*
    ==============================================
    ADMINISTRATOR LOGIN
    ==============================================
    */

    if (
        loginType === "admin"
    ) {

        const adminUsername =
            localStorage.getItem(
                "adminUsername"
            ) || "admin";

        const adminPassword =
            localStorage.getItem(
                "adminPassword"
            ) || "admin123";


        if (
            username === adminUsername
            &&
            password === adminPassword
        ) {

            localStorage.setItem(
                "loggedIn",
                "true"
            );

            localStorage.setItem(
                "userRole",
                "admin"
            );

            localStorage.setItem(
                "currentUser",
                "Administrator"
            );


            message.className =
                "message success";

            message.textContent =
                "Administrator login successful.";


            setTimeout(
                function() {

                    window.location.href =
                        "index.html";

                },
                500
            );

            return;

        }


        message.className =
            "message error";

        message.textContent =
            "Invalid administrator username or password.";

        return;

    }


    /*
    ==============================================
    STUDENT LOGIN
    ==============================================
    */

    const students =
        JSON.parse(
            localStorage.getItem(
                "students"
            )
        ) || [];


    /*
    FIND STUDENT BY ID
    */

    const student =
        students.find(
            function(item) {

                return String(
                    item.studentId || ""
                ).trim()
                ===
                username;

            }
        );


    if (!student) {

        message.className =
            "message error";

        message.textContent =
            "Student ID not found.";

        return;

    }


    /*
    ==============================================
    STUDENT PASSWORD
    ==============================================
    */

    const studentPassword =
        String(
            student.password ||
            DEFAULT_STUDENT_PASSWORD
        );


    if (
        password !== studentPassword
    ) {

        message.className =
            "message error";

        message.textContent =
            "Incorrect password.";

        return;

    }


    /*
    ==============================================
    STUDENT LOGIN SUCCESS
    ==============================================
    */

    localStorage.setItem(
        "loggedIn",
        "true"
    );

    localStorage.setItem(
        "userRole",
        "student"
    );

    localStorage.setItem(
        "currentStudentId",
        String(
            student.studentId
        )
    );

    localStorage.setItem(
        "currentStudentName",
        student.name ||
        student.fullName ||
        ""
    );


    /*
    STORE PASSWORD STATUS
    */

    localStorage.setItem(
        "studentPasswordChanged",
        student.passwordChanged === true
            ? "true"
            : "false"
    );


    message.className =
        "message success";

    message.textContent =
        "Login successful. Opening student portal...";


    /*
    ==============================================
    IMPORTANT
    ==============================================

    Your file is called:

    portal.html

    NOT:

    student-portal.html
    */

    setTimeout(
        function() {

            window.location.href =
                "portal.html";

        },
        500
    );

}


/*
==================================================
SHOW / HIDE PASSWORD
==================================================
*/

function togglePassword() {

    const password =
        document.getElementById(
            "password"
        );

    const button =
        document.querySelector(
            ".showPassword"
        );


    if (
        password.type === "password"
    ) {

        password.type =
            "text";

        button.textContent =
            "Hide";

    }

    else {

        password.type =
            "password";

        button.textContent =
            "Show";

    }

}


/*
==================================================
ENTER KEY LOGIN
==================================================
*/

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            login();

        }

    }
);

</script>

</body>

</html>
