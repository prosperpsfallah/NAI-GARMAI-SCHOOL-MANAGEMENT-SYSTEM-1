<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>NAI GARMAI | Student Portal</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #222;
}

.container {
    max-width: 1100px;
    margin: auto;
}

.header {
    background: #0b3d62;
    color: white;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
}

.header h1 {
    margin: 0 0 8px;
}

.header p {
    margin: 0;
}

button {
    border: none;
    border-radius: 8px;
    padding: 12px 18px;
    font-weight: bold;
    cursor: pointer;
}

.logout {
    background: #d9534f;
    color: white;
    margin-top: 15px;
}

.panel {
    background: white;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.panel h2 {
    margin-top: 0;
    color: #0b3d62;
}

.studentInfo {
    display: grid;
    grid-template-columns:
        repeat(
            auto-fit,
            minmax(200px, 1fr)
        );
    gap: 15px;
}

.infoBox {
    background: #f8fafc;
    padding: 15px;
    border-radius: 8px;
    border-left: 4px solid #0b3d62;
}

.infoBox strong {
    display: block;
    color: #0b3d62;
    margin-bottom: 5px;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}

th,
td {
    padding: 12px;
    border-bottom: 1px solid #ddd;
    text-align: left;
}

th {
    background: #0b3d62;
    color: white;
}

.empty {
    color: #777;
}

.success {
    color: #198754;
    font-weight: bold;
}

.error {
    color: #d9534f;
    font-weight: bold;
}

@media (max-width: 600px) {

    body {
        padding: 10px;
    }

    .panel {
        padding: 15px;
    }

    table {
        font-size: 13px;
    }

    th,
    td {
        padding: 8px;
    }

}

</style>

</head>

<body>

<div class="container">

    <div class="header">

        <h1>
            NAI GARMAI SCHOOL SYSTEM
        </h1>

        <p>
            Student Portal
        </p>

        <button
            class="logout"
            onclick="logout()"
        >
            Logout
        </button>

    </div>


    <!-- STUDENT INFORMATION -->

    <div class="panel">

        <h2>
            My Information
        </h2>

        <div
            class="studentInfo"
            id="studentInfo"
        >
            Loading...
        </div>

    </div>


    <!-- GRADES -->

    <div class="panel">

        <h2>
            My Grades
        </h2>

        <div id="gradesContainer">

            <p class="empty">
                No grades available yet.
            </p>

        </div>

    </div>


    <!-- ATTENDANCE -->

    <div class="panel">

        <h2>
            My Attendance
        </h2>

        <div id="attendanceContainer">

            <p class="empty">
                No attendance records available yet.
            </p>

        </div>

    </div>

</div>


<script>

/*
==================================================
LOGIN SECURITY
==================================================
*/

const loggedIn =
    localStorage.getItem(
        "loggedIn"
    );

const role =
    localStorage.getItem(
        "userRole"
    );

const currentStudentId =
    localStorage.getItem(
        "currentStudentId"
    );


/*
==================================================
CHECK STUDENT LOGIN
==================================================
*/

if (
    loggedIn !== "true"
    ||
    role !== "student"
    ||
    !currentStudentId
) {

    window.location.href =
        "login.html";

}


/*
==================================================
LOAD STUDENTS
==================================================
*/

const students =
    JSON.parse(
        localStorage.getItem(
            "students"
        )
    ) || [];


/*
==================================================
FIND CURRENT STUDENT
==================================================
*/

const student =
    students.find(
        function(item) {

            return String(
                item.studentId || ""
            )
            ===
            String(
                currentStudentId
            );

        }
    );


/*
==================================================
CHECK STUDENT
==================================================
*/

if (!student) {

    alert(
        "Student account could not be found."
    );

    logout();

}


/*
==================================================
DISPLAY STUDENT INFORMATION
==================================================
*/

function displayStudentInfo() {

    const container =
        document.getElementById(
            "studentInfo"
        );

    container.innerHTML =

        `
        <div class="infoBox">
            <strong>Student ID</strong>
            ${escapeHTML(
                student.studentId || ""
            )}
        </div>

        <div class="infoBox">
            <strong>Full Name</strong>
            ${escapeHTML(
                student.name ||
                student.fullName ||
                ""
            )}
        </div>

        <div class="infoBox">
            <strong>Class / Grade</strong>
            ${escapeHTML(
                student.className ||
                "Not provided"
            )}
        </div>

        <div class="infoBox">
            <strong>Gender</strong>
            ${escapeHTML(
                student.gender ||
                "Not provided"
            )}
        </div>

        <div class="infoBox">
            <strong>Date of Birth</strong>
            ${escapeHTML(
                student.dateOfBirth ||
                "Not provided"
            )}
        </div>

        <div class="infoBox">
            <strong>Phone</strong>
            ${escapeHTML(
                student.phone ||
                "Not provided"
            )}
        </div>
        `;

}


/*
==================================================
LOAD GRADES
==================================================
*/

function loadGrades() {

    const container =
        document.getElementById(
            "gradesContainer"
        );

    const allGrades =
        JSON.parse(
            localStorage.getItem(
                "grades"
            )
        ) || [];


    const myGrades =
        allGrades.filter(
            function(grade) {

                return String(
                    grade.studentId || ""
                )
                ===
                String(
                    currentStudentId
                );

            }
        );


    if (
        myGrades.length === 0
    ) {

        container.innerHTML =
            `
            <p class="empty">
                No grades have been posted yet.
            </p>
            `;

        return;

    }


    let html =

        `
        <table>

        <thead>

        <tr>
            <th>Subject</th>
            <th>Score</th>
            <th>Grade</th>
            <th>Term</th>
        </tr>

        </thead>

        <tbody>
        `;


    myGrades.forEach(
        function(grade) {

            html +=

                `
                <tr>

                    <td>
                        ${escapeHTML(
                            grade.subject ||
                            "N/A"
                        )}
                    </td>

                    <td>
                        ${escapeHTML(
                            grade.score ||
                            "N/A"
                        )}
                    </td>

                    <td>
                        ${escapeHTML(
                            grade.grade ||
                            "N/A"
                        )}
                    </td>

                    <td>
                        ${escapeHTML(
                            grade.term ||
                            "N/A"
                        )}
                    </td>

                </tr>
                `;

        }
    );


    html +=
        `
        </tbody>

        </table>
        `;


    container.innerHTML =
        html;

}


/*
==================================================
LOAD ATTENDANCE
==================================================
*/

function loadAttendance() {

    const container =
        document.getElementById(
            "attendanceContainer"
        );

    const allAttendance =
        JSON.parse(
            localStorage.getItem(
                "attendance"
            )
        ) || [];


    const myAttendance =
        allAttendance.filter(
            function(record) {

                return String(
                    record.studentId || ""
                )
                ===
                String(
                    currentStudentId
                );

            }
        );


    if (
        myAttendance.length === 0
    ) {

        container.innerHTML =
            `
            <p class="empty">
                No attendance records have been posted yet.
            </p>
            `;

        return;

    }


    let html =

        `
        <table>

        <thead>

        <tr>
            <th>Date</th>
            <th>Status</th>
        </tr>

        </thead>

        <tbody>
        `;


    myAttendance.forEach(
        function(record) {

            html +=

                `
                <tr>

                    <td>
                        ${escapeHTML(
                            record.date ||
                            "N/A"
                        )}
                    </td>

                    <td>
                        ${escapeHTML(
                            record.status ||
                            "N/A"
                        )}
                    </td>

                </tr>
                `;

        }
    );


    html +=
        `
        </tbody>

        </table>
        `;


    container.innerHTML =
        html;

}


/*
==================================================
LOGOUT
==================================================
*/

function logout() {

    localStorage.removeItem(
        "loggedIn"
    );

    localStorage.removeItem(
        "userRole"
    );

    localStorage.removeItem(
        "currentStudentId"
    );

    localStorage.removeItem(
        "currentStudentName"
    );

    localStorage.removeItem(
        "studentPasswordChanged"
    );

    window.location.href =
        "login.html";

}


/*
==================================================
HTML SECURITY
==================================================
*/

function escapeHTML(value) {

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/*
==================================================
START
==================================================
*/

if (student) {

    displayStudentInfo();

    loadGrades();

    loadAttendance();

}

</script>

</body>

</html>
