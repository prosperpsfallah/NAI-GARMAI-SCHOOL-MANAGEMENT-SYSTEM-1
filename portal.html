<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>NAI GARMAI | Student Portal</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 15px;
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #222;
}

.container {
    max-width: 1000px;
    margin: auto;
}

.header {
    background: #0b3d62;
    color: white;
    padding: 22px;
    border-radius: 12px;
    margin-bottom: 20px;
}

.header h1 {
    margin: 0 0 8px;
}

.header p {
    margin: 0;
}

button {
    border: none;
    border-radius: 8px;
    padding: 12px 18px;
    font-weight: bold;
    cursor: pointer;
}

.logout {
    background: #d9534f;
    color: white;
    margin-top: 15px;
}

.panel {
    background: white;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.panel h2 {
    color: #0b3d62;
    margin-top: 0;
}

.infoGrid {
    display: grid;
    grid-template-columns:
        repeat(
            auto-fit,
            minmax(200px, 1fr)
        );
    gap: 15px;
}

.infoBox {
    background: #f8fafc;
    padding: 15px;
    border-radius: 8px;
    border-left: 4px solid #0b3d62;
}

.infoBox strong {
    display: block;
    color: #0b3d62;
    margin-bottom: 5px;
}

.empty {
    color: #777;
}

.message {
    margin-top: 12px;
    font-weight: bold;
}

.error {
    color: #d9534f;
}

.success {
    color: #198754;
}

@media (max-width: 600px) {

    body {
        padding: 10px;
    }

    .panel {
        padding: 15px;
    }

    .header {
        padding: 18px;
    }

}

</style>

</head>

<body>

<div class="container">

<!-- HEADER -->

<div class="header">

<h1>
NAI GARMAI SCHOOL SYSTEM
</h1>

<p>
Student Portal
</p>

<button
    class="logout"
    onclick="logout()"
>
Logout
</button>

</div>


<!-- STUDENT INFORMATION -->

<div class="panel">

<h2>
Welcome, <span id="studentName">Student</span>
</h2>

<p>
Here is your student information.
</p>

<div
    id="studentInfo"
    class="infoGrid"
>

</div>

</div>


<!-- GRADES -->

<div class="panel">

<h2>
My Grades
</h2>

<div id="grades">

<p class="empty">
No grades have been posted yet.
</p>

</div>

</div>


<!-- ATTENDANCE -->

<div class="panel">

<h2>
My Attendance
</h2>

<div id="attendance">

<p class="empty">
No attendance records have been posted yet.
</p>

</div>

</div>


</div>


<script>

/*
==================================================
STUDENT LOGIN SECURITY
==================================================
*/

const loggedIn =
    localStorage.getItem(
        "loggedIn"
    );

const userRole =
    localStorage.getItem(
        "userRole"
    );


/*
==================================================
MAKE SURE USER IS A STUDENT
==================================================
*/

if (
    loggedIn !== "true"
    ||
    userRole !== "student"
) {

    window.location.href =
        "login.html";

}


/*
==================================================
GET CURRENT STUDENT
==================================================
*/

const currentStudentId =
    localStorage.getItem(
        "currentStudentId"
    );


const students =
    JSON.parse(
        localStorage.getItem(
            "students"
        )
    ) || [];


const student =
    students.find(
        function(item) {

            return String(
                item.studentId || ""
            ) ===
            String(
                currentStudentId || ""
            );

        }
    );


/*
==================================================
CHECK STUDENT
==================================================
*/

if (!student) {

    alert(
        "Student account could not be found."
    );

    localStorage.removeItem(
        "loggedIn"
    );

    localStorage.removeItem(
        "userRole"
    );

    window.location.href =
        "login.html";

}


/*
==================================================
DISPLAY STUDENT INFORMATION
==================================================
*/

else {

    const name =
        student.name ||
        student.fullName ||
        "Student";


    document.getElementById(
        "studentName"
    ).textContent =
        name;


    const info =
        document.getElementById(
            "studentInfo"
        );


    info.innerHTML =

        createInfoBox(
            "Student ID",
            student.studentId
        )

        +

        createInfoBox(
            "Full Name",
            name
        )

        +

        createInfoBox(
            "Date of Birth",
            student.dateOfBirth ||
            "Not provided"
        )

        +

        createInfoBox(
            "Gender",
            student.gender ||
            "Not provided"
        )

        +

        createInfoBox(
            "Class / Grade",
            student.className ||
            "Not provided"
        )

        +

        createInfoBox(
            "Phone",
            student.phone ||
            "Not provided"
        )

        +

        createInfoBox(
            "Parent / Guardian",
            student.guardianName ||
            "Not provided"
        )

        +

        createInfoBox(
            "Guardian Phone",
            student.guardianPhone ||
            "Not provided"
        );

}


/*
==================================================
CREATE INFORMATION BOX
==================================================
*/

function createInfoBox(
    title,
    value
) {

    return (

        "<div class='infoBox'>"

        +

        "<strong>"
        +
        escapeHTML(title)
        +
        "</strong>"

        +

        "<span>"
        +
        escapeHTML(value)
        +
        "</span>"

        +

        "</div>"

    );

}


/*
==================================================
HTML SECURITY
==================================================
*/

function escapeHTML(
    value
) {

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/*
==================================================
LOGOUT
==================================================
*/

function logout() {

    localStorage.removeItem(
        "loggedIn"
    );

    localStorage.removeItem(
        "userRole"
    );

    localStorage.removeItem(
        "currentStudentId"
    );

    localStorage.removeItem(
        "currentStudentName"
    );

    localStorage.removeItem(
        "studentPasswordChanged"
    );


    window.location.href =
        "login.html";

}

</script>

</body>

</html>
